<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>授業用大型タイマー | センセイボックス</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@700;900&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    .font-mono-tech { font-family: 'Chivo Mono', monospace; }
    
    /* 背景パターンの動的切り替え */
    body.theme-dark {
      background-color: #020617;
      color: #f8fafc;
    }
    body.theme-dark .tech-bg {
      background-image: radial-gradient(rgba(99, 102, 241, 0.15) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    body.theme-light {
      background-color: #f8fafc;
      color: #0f172a;
    }
    body.theme-light .tech-bg {
      background-image: radial-gradient(rgba(148, 163, 184, 0.25) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* 時間表示の文字幅を等幅固定 */
    .timer-digits {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
    }

    /* 終了時の点滅アニメーション */
    @keyframes timeUpBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .time-up {
      animation: timeUpBlink 0.8s infinite;
      color: #ef4444 !important;
    }
  </style>
</head>
<body class="theme-light min-h-screen flex flex-col antialiased transition-colors duration-200">

  <!-- ヘッダー -->
  <header id="appHeader" class="border-b sticky top-0 z-30 transition-colors bg-white/90 border-slate-200 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="../" class="p-2 text-slate-400 hover:text-slate-800 rounded-xl transition" title="ポータルへ戻る">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div class="flex items-center gap-2">
          <span class="text-2xl">⏱️</span>
          <h1 class="text-lg sm:text-xl font-black tracking-tight" id="headerTitle">授業用大型タイマー</h1>
        </div>
      </div>

      <!-- 右側：設定バー（テーマ切替・音量・全画面） -->
      <div class="flex items-center gap-2">
        <!-- 音量コントロール -->
        <div id="volumeBox" class="flex items-center gap-2 px-3 py-1.5 rounded-xl border bg-slate-100 border-slate-200 text-xs font-bold">
          <button id="testSoundBtn" class="flex items-center gap-1 text-indigo-600 hover:opacity-80 transition" title="チャイムのテスト再生">
            <i data-lucide="volume-2" class="w-4 h-4" id="volumeIcon"></i>
            <span class="hidden sm:inline">テスト</span>
          </button>
          <input id="volumeSlider" type="range" min="0" max="100" value="80" class="w-16 sm:w-20 accent-indigo-600 cursor-pointer">
          <span id="volumeValue" class="font-mono-tech w-7 text-right">80%</span>
        </div>

        <!-- テーマ切り替え（白 ⇄ 黒） -->
        <button id="themeToggleBtn" class="px-3 py-2 rounded-xl border text-xs font-bold transition flex items-center gap-1.5 bg-slate-100 border-slate-200 hover:bg-slate-200" title="白/黒トーンの切り替え">
          <i data-lucide="moon" class="w-4 h-4" id="themeIcon"></i>
          <span id="themeText" class="hidden sm:inline">黒トーン</span>
        </button>

        <!-- 全画面切り替え -->
        <button id="fullscreenBtn" class="p-2 rounded-xl border text-slate-500 hover:text-slate-800 transition bg-slate-100 border-slate-200" title="全画面表示">
          <i data-lucide="maximize" class="w-5 h-5" id="fsIcon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 flex flex-col justify-between p-4 sm:p-8 max-w-6xl w-full mx-auto tech-bg">

    <!-- 上部プリセットボタングループ ＆ カスタム設定ボタン -->
    <div id="presetContainer" class="flex flex-wrap items-center justify-center gap-2 sm:gap-2.5 py-2">
      <button data-sec="60" class="preset-btn px-3.5 py-1.5 rounded-xl border font-black text-xs sm:text-sm transition bg-white border-slate-200 shadow-xs hover:border-indigo-400">1分</button>
      <button data-sec="180" class="preset-btn px-3.5 py-1.5 rounded-xl border font-black text-xs sm:text-sm transition bg-white border-slate-200 shadow-xs hover:border-indigo-400">3分</button>
      <button data-sec="300" class="preset-btn px-3.5 py-1.5 rounded-xl border font-black text-xs sm:text-sm transition bg-white border-slate-200 shadow-xs hover:border-indigo-400">5分</button>
      <button data-sec="600" class="preset-btn px-3.5 py-1.5 rounded-xl border font-black text-xs sm:text-sm transition bg-white border-slate-200 shadow-xs hover:border-indigo-400">10分</button>
      <button data-sec="900" class="preset-btn px-3.5 py-1.5 rounded-xl border font-black text-xs sm:text-sm transition bg-white border-slate-200 shadow-xs hover:border-indigo-400">15分</button>
      <button data-sec="1200" class="preset-btn px-3.5 py-1.5 rounded-xl border font-black text-xs sm:text-sm transition bg-white border-slate-200 shadow-xs hover:border-indigo-400">20分</button>
      <button data-sec="2700" class="preset-btn px-3.5 py-1.5 rounded-xl border font-black text-xs sm:text-sm transition bg-white border-slate-200 shadow-xs hover:border-indigo-400">45分(1コマ)</button>
      
      <!-- 任意時間設定ボタン -->
      <button id="openCustomModalBtn" class="px-3.5 py-1.5 rounded-xl border-2 border-dashed border-indigo-400/80 text-indigo-600 font-black text-xs sm:text-sm transition bg-indigo-50/50 hover:bg-indigo-100 flex items-center gap-1 shadow-xs">
        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
        <span>秒・分を指定</span>
      </button>
    </div>

    <!-- 中央：超巨大タイマー表示（クリックで直接編集可能） -->
    <div class="my-auto text-center flex flex-col items-center justify-center py-4 sm:py-8">
      <div id="timerDisplay" title="クリックして時間を指定" class="timer-digits font-mono-tech font-black text-7xl sm:text-9xl md:text-[14rem] lg:text-[16rem] leading-none tracking-tighter drop-shadow-sm select-none cursor-pointer hover:opacity-90 active:scale-98 transition-transform">
        05:00
      </div>

      <!-- iPad用音声注意喚起 -->
      <div id="ipadNotice" class="mt-4 text-xs font-bold text-slate-400 flex items-center gap-1.5 opacity-80">
        <i data-lucide="info" class="w-3.5 h-3.5 text-indigo-500"></i>
        <span>数字をクリックすると分・秒を直接入力できます（iPadは消音モード解除で音が鳴ります）</span>
      </div>
    </div>

    <!-- 下部：コントロールボタン群 -->
    <div class="flex flex-col items-center gap-4 pb-4">
      
      <!-- 時間の微調整 (+1分 / -1分 / +10秒 / -10秒) -->
      <div class="flex flex-wrap items-center justify-center gap-2">
        <button id="minusMinBtn" class="adjust-btn px-3 py-1.5 rounded-xl border text-xs sm:text-sm font-bold transition flex items-center gap-1 bg-white border-slate-200 shadow-xs hover:border-slate-400 active:scale-95">
          <i data-lucide="minus" class="w-3 h-3"></i>
          <span>1分</span>
        </button>
        <button id="minusTenSecBtn" class="adjust-btn px-3 py-1.5 rounded-xl border text-xs sm:text-sm font-bold transition flex items-center gap-1 bg-white border-slate-200 shadow-xs hover:border-slate-400 active:scale-95">
          <i data-lucide="minus" class="w-3 h-3"></i>
          <span>10秒</span>
        </button>
        <button id="plusTenSecBtn" class="adjust-btn px-3 py-1.5 rounded-xl border text-xs sm:text-sm font-bold transition flex items-center gap-1 bg-white border-slate-200 shadow-xs hover:border-slate-400 active:scale-95">
          <i data-lucide="plus" class="w-3 h-3"></i>
          <span>10秒</span>
        </button>
        <button id="plusMinBtn" class="adjust-btn px-3 py-1.5 rounded-xl border text-xs sm:text-sm font-bold transition flex items-center gap-1 bg-white border-slate-200 shadow-xs hover:border-slate-400 active:scale-95">
          <i data-lucide="plus" class="w-3 h-3"></i>
          <span>1分</span>
        </button>
      </div>

      <!-- メインアクション（スタート / 一時停止 / リセット） -->
      <div class="flex items-center gap-3 sm:gap-4 w-full max-w-md justify-center">
        <button id="resetBtn" class="flex-1 py-4 px-6 rounded-2xl border font-black text-base sm:text-lg transition flex items-center justify-center gap-2 bg-slate-200 border-slate-300 text-slate-700 hover:bg-slate-300 active:scale-95">
          <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
          <span>リセット</span>
        </button>
        <button id="startStopBtn" class="flex-2 py-4 px-8 rounded-2xl font-black text-lg sm:text-xl transition flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white shadow-lg">
          <i data-lucide="play" class="w-6 h-6 fill-current" id="playIcon"></i>
          <span id="startStopText">スタート</span>
        </button>
      </div>

      <div class="text-[11px] font-bold text-slate-400 font-mono-tech">
        [Space] でスタート / 停止 &bull; [R] でリセット
      </div>

    </div>

  </main>

  <!-- ========================================== -->
  <!-- 任意時間（分・秒）設定モーダル -->
  <!-- ========================================== -->
  <div id="customTimeModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div id="modalBox" class="w-full max-w-sm rounded-3xl p-6 shadow-2xl border transition-colors bg-white border-slate-200 text-slate-900 space-y-5">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="font-black text-base sm:text-lg flex items-center gap-2">
          <i data-lucide="clock" class="w-5 h-5 text-indigo-600"></i>
          <span>時間を設定</span>
        </h3>
        <button id="closeModalBtn" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 分・秒入力スピンボックス -->
      <div class="flex items-center justify-center gap-4 py-2">
        <!-- 分 -->
        <div class="flex flex-col items-center gap-1.5">
          <label class="text-xs font-black text-slate-400">分 (Minutes)</label>
          <div class="flex items-center border rounded-2xl overflow-hidden bg-slate-50 border-slate-200">
            <input id="customMinInput" type="number" min="0" max="99" value="5" class="w-20 p-3 text-center text-3xl font-mono-tech font-black bg-transparent focus:outline-none">
          </div>
        </div>

        <span class="text-3xl font-black text-slate-400 mt-5">:</span>

        <!-- 秒 -->
        <div class="flex flex-col items-center gap-1.5">
          <label class="text-xs font-black text-slate-400">秒 (Seconds)</label>
          <div class="flex items-center border rounded-2xl overflow-hidden bg-slate-50 border-slate-200">
            <input id="customSecInput" type="number" min="0" max="59" value="0" class="w-20 p-3 text-center text-3xl font-mono-tech font-black bg-transparent focus:outline-none">
          </div>
        </div>
      </div>

      <!-- クイック加算ボタン -->
      <div class="flex items-center justify-center gap-2 pt-1">
        <button type="button" class="quick-add-btn text-xs font-bold px-2.5 py-1.5 rounded-lg border bg-slate-50 border-slate-200 hover:border-indigo-400" data-add="10">+10秒</button>
        <button type="button" class="quick-add-btn text-xs font-bold px-2.5 py-1.5 rounded-lg border bg-slate-50 border-slate-200 hover:border-indigo-400" data-add="30">+30秒</button>
        <button type="button" class="quick-add-btn text-xs font-bold px-2.5 py-1.5 rounded-lg border bg-slate-50 border-slate-200 hover:border-indigo-400" data-add="60">+1分</button>
        <button type="button" class="quick-add-btn text-xs font-bold px-2.5 py-1.5 rounded-lg border bg-slate-50 border-slate-200 hover:border-indigo-400" data-add="300">+5分</button>
      </div>

      <!-- 設定反映ボタン -->
      <div class="pt-2">
        <button id="applyCustomBtn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-black text-base rounded-2xl shadow-md transition">
          この時間でセットする
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. iPad / iOS 対策済み Web Audio API チャイム
    // ==========================================
    class ChimePlayer {
      constructor() {
        this.ctx = null;
        this.volume = 0.8;
      }

      unlock() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      setVolume(val) {
        this.volume = Math.max(0, Math.min(1, val));
      }

      playChime() {
        this.unlock();
        if (this.volume <= 0) return;

        const notes = [
          { f: 554.37, d: 0.8 },
          { f: 440.00, d: 0.8 },
          { f: 493.88, d: 0.8 },
          { f: 329.63, d: 1.4 },

          { f: 329.63, d: 0.8 },
          { f: 493.88, d: 0.8 },
          { f: 554.37, d: 0.8 },
          { f: 440.00, d: 1.6 }
        ];

        let start = this.ctx.currentTime + 0.05;

        notes.forEach(note => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(note.f, start);

          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.35 * this.volume, start + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, start + note.d);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(start);
          osc.stop(start + note.d);

          start += note.d * 0.85;
        });
      }
    }

    const sound = new ChimePlayer();

    // ==========================================
    // 2. タイマーの状態管理
    // ==========================================
    let totalSeconds = 300; // 初期値：5分
    let remainingSeconds = 300;
    let timerId = null;
    let isRunning = false;

    const timerDisplay = document.getElementById('timerDisplay');
    const startStopBtn = document.getElementById('startStopBtn');
    const startStopText = document.getElementById('startStopText');
    const playIcon = document.getElementById('playIcon');
    const resetBtn = document.getElementById('resetBtn');

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateDisplay() {
      timerDisplay.textContent = formatTime(remainingSeconds);
      if (remainingSeconds === 0) {
        timerDisplay.classList.add('time-up');
      } else {
        timerDisplay.classList.remove('time-up');
      }
    }

    function startTimer() {
      sound.unlock();

      if (remainingSeconds <= 0) {
        remainingSeconds = totalSeconds;
        updateDisplay();
      }

      isRunning = true;
      startStopText.textContent = '一時停止';
      startStopBtn.className = 'flex-2 py-4 px-8 rounded-2xl font-black text-lg sm:text-xl transition flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white shadow-lg';
      playIcon.setAttribute('data-lucide', 'pause');
      lucide.createIcons();

      timerId = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();

          if (remainingSeconds === 0) {
            pauseTimer();
            sound.playChime();
          }
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerId);
      timerId = null;
      startStopText.textContent = 'スタート';
      startStopBtn.className = 'flex-2 py-4 px-8 rounded-2xl font-black text-lg sm:text-xl transition flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white shadow-lg';
      playIcon.setAttribute('data-lucide', 'play');
      lucide.createIcons();
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = totalSeconds;
      updateDisplay();
    }

    // ==========================================
    // 3. テーマ切り替え（白トーン / 黒トーン）
    // ==========================================
    let currentTheme = localStorage.getItem('sb_timer_theme') || 'light';

    function applyTheme(theme) {
      currentTheme = theme;
      localStorage.setItem('sb_timer_theme', theme);

      const header = document.getElementById('appHeader');
      const themeText = document.getElementById('themeText');
      const themeIcon = document.getElementById('themeIcon');
      const volumeBox = document.getElementById('volumeBox');
      const presetBtns = document.querySelectorAll('.preset-btn');
      const adjustBtns = document.querySelectorAll('.adjust-btn');
      const modalBox = document.getElementById('modalBox');

      if (theme === 'dark') {
        document.body.className = 'theme-dark min-h-screen flex flex-col antialiased transition-colors duration-200';
        header.className = 'border-b sticky top-0 z-30 transition-colors bg-slate-900/90 border-slate-800 backdrop-blur-md text-white';
        themeText.textContent = '白トーン';
        themeIcon.setAttribute('data-lucide', 'sun');
        volumeBox.className = 'flex items-center gap-2 px-3 py-1.5 rounded-xl border bg-slate-800 border-slate-700 text-xs font-bold text-slate-200';
        resetBtn.className = 'flex-1 py-4 px-6 rounded-2xl border font-black text-base sm:text-lg transition flex items-center justify-center gap-2 bg-slate-800 border-slate-700 text-slate-200 hover:bg-slate-700 active:scale-95';

        presetBtns.forEach(btn => {
          btn.className = 'preset-btn px-3.5 py-1.5 rounded-xl border font-black text-xs sm:text-sm transition bg-slate-900 border-slate-800 text-slate-200 shadow-xs hover:border-indigo-400';
        });

        adjustBtns.forEach(btn => {
          btn.className = 'adjust-btn px-3 py-1.5 rounded-xl border text-xs sm:text-sm font-bold transition flex items-center gap-1 bg-slate-900 border-slate-800 text-slate-200 shadow-xs hover:border-slate-700 active:scale-95';
        });

        modalBox.className = 'w-full max-w-sm rounded-3xl p-6 shadow-2xl border transition-colors bg-slate-900 border-slate-800 text-white space-y-5';
      } else {
        document.body.className = 'theme-light min-h-screen flex flex-col antialiased transition-colors duration-200';
        header.className = 'border-b sticky top-0 z-30 transition-colors bg-white/90 border-slate-200 backdrop-blur-md text-slate-900';
        themeText.textContent = '黒トーン';
        themeIcon.setAttribute('data-lucide', 'moon');
        volumeBox.className = 'flex items-center gap-2 px-3 py-1.5 rounded-xl border bg-slate-100 border-slate-200 text-xs font-bold text-slate-700';
        resetBtn.className = 'flex-1 py-4 px-6 rounded-2xl border font-black text-base sm:text-lg transition flex items-center justify-center gap-2 bg-slate-200 border-slate-300 text-slate-700 hover:bg-slate-300 active:scale-95';

        presetBtns.forEach(btn => {
          btn.className = 'preset-btn px-3.5 py-1.5 rounded-xl border font-black text-xs sm:text-sm transition bg-white border-slate-200 text-slate-800 shadow-xs hover:border-indigo-400';
        });

        adjustBtns.forEach(btn => {
          btn.className = 'adjust-btn px-3 py-1.5 rounded-xl border text-xs sm:text-sm font-bold transition flex items-center gap-1 bg-white border-slate-200 text-slate-700 shadow-xs hover:border-slate-400 active:scale-95';
        });

        modalBox.className = 'w-full max-w-sm rounded-3xl p-6 shadow-2xl border transition-colors bg-white border-slate-200 text-slate-900 space-y-5';
      }
      lucide.createIcons();
    }

    // ==========================================
    // 4. モーダル＆カスタム時間設定
    // ==========================================
    const customModal = document.getElementById('customTimeModal');
    const minInput = document.getElementById('customMinInput');
    const secInput = document.getElementById('customSecInput');

    function openCustomModal() {
      const curM = Math.floor(remainingSeconds / 60);
      const curS = remainingSeconds % 60;
      minInput.value = curM;
      secInput.value = curS;
      customModal.classList.remove('hidden');
      minInput.focus();
      minInput.select();
    }

    function closeCustomModal() {
      customModal.classList.add('hidden');
    }

    function applyCustomTime() {
      const m = Math.max(0, parseInt(minInput.value, 10) || 0);
      const s = Math.max(0, Math.min(59, parseInt(secInput.value, 10) || 0));
      const calcSec = (m * 60) + s;

      if (calcSec <= 0) {
        alert('1秒以上の時間を設定してください');
        return;
      }

      totalSeconds = calcSec;
      resetTimer();
      closeCustomModal();
    }

    // ==========================================
    // 5. イベントリスナー登録
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      applyTheme(currentTheme);
      updateDisplay();
      lucide.createIcons();

      // テーマ切り替え
      document.getElementById('themeToggleBtn').onclick = () => {
        applyTheme(currentTheme === 'light' ? 'dark' : 'light');
      };

      // 音量スライダー
      const slider = document.getElementById('volumeSlider');
      const valText = document.getElementById('volumeValue');
      slider.oninput = (e) => {
        const val = e.target.value;
        valText.textContent = `${val}%`;
        sound.setVolume(val / 100);
      };

      // チャイムテスト
      document.getElementById('testSoundBtn').onclick = () => {
        sound.unlock();
        sound.playChime();
      };

      // スタート / 停止
      startStopBtn.onclick = () => {
        if (isRunning) pauseTimer();
        else startTimer();
      };

      // リセット
      resetBtn.onclick = resetTimer;

      // プリセットボタン
      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.onclick = () => {
          totalSeconds = parseInt(btn.dataset.sec, 10);
          resetTimer();
        };
      });

      // 微調整ボタン群
      document.getElementById('plusMinBtn').onclick = () => {
        totalSeconds += 60;
        remainingSeconds += 60;
        updateDisplay();
      };
      document.getElementById('minusMinBtn').onclick = () => {
        if (remainingSeconds > 60) {
          totalSeconds = Math.max(1, totalSeconds - 60);
          remainingSeconds -= 60;
          updateDisplay();
        }
      };
      document.getElementById('plusTenSecBtn').onclick = () => {
        totalSeconds += 10;
        remainingSeconds += 10;
        updateDisplay();
      };
      document.getElementById('minusTenSecBtn').onclick = () => {
        if (remainingSeconds > 10) {
          totalSeconds = Math.max(1, totalSeconds - 10);
          remainingSeconds -= 10;
          updateDisplay();
        }
      };

      // カスタムモーダルの開閉
      document.getElementById('openCustomModalBtn').onclick = openCustomModal;
      timerDisplay.onclick = openCustomModal;
      document.getElementById('closeModalBtn').onclick = closeCustomModal;
      document.getElementById('applyCustomBtn').onclick = applyCustomTime;

      // モーダル背景クリックで閉じる
      customModal.onclick = (e) => {
        if (e.target === customModal) closeCustomModal();
      };

      // クイック加算ボタン
      document.querySelectorAll('.quick-add-btn').forEach(btn => {
        btn.onclick = () => {
          const addSec = parseInt(btn.dataset.add, 10);
          let curTotal = (parseInt(minInput.value, 10) || 0) * 60 + (parseInt(secInput.value, 10) || 0);
          curTotal += addSec;
          minInput.value = Math.floor(curTotal / 60);
          secInput.value = curTotal % 60;
        };
      });

      // Enterキーで時間設定を決定
      [minInput, secInput].forEach(inp => {
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') applyCustomTime();
        });
      });

      // キーボードショートカット
      window.addEventListener('keydown', (e) => {
        if (!customModal.classList.contains('hidden')) return; // モーダル開いてる時は無効

        if (e.code === 'Space') {
          e.preventDefault();
          if (isRunning) pauseTimer();
          else startTimer();
        } else if (e.code === 'KeyR') {
          e.preventDefault();
          resetTimer();
        }
      });

      // 全画面表示
      const fsBtn = document.getElementById('fullscreenBtn');
      fsBtn.onclick = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      };
    });
  </script>
</body>
</html>
