  <script>
    // ==========================================
    // 1. Web Audio API サウンドエンジン（学校チャイム・電子音・卓上ベル）
    // ==========================================
    class TimerSoundEngine {
      constructor() {
        this.ctx = null;
      }

      unlock() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      play(type) {
        if (type === 'mute') return;
        this.unlock();
        const now = this.ctx.currentTime;

        if (type === 'chime') {
          // ウェストミンスターの鐘（キン・コン・カン・コン）
          const notes = [
            { freq: 349.23, time: 0.0, dur: 0.55 }, // ファ
            { freq: 440.00, time: 0.5, dur: 0.55 }, // ラ
            { freq: 392.00, time: 1.0, dur: 0.55 }, // ソ
            { freq: 261.63, time: 1.5, dur: 1.10 }  // ド
          ];
          notes.forEach(n => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(n.freq, now + n.time);

            gain.gain.setValueAtTime(0.001, now + n.time);
            gain.gain.linearRampToValueAtTime(0.32, now + n.time + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + n.time + n.dur);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + n.time);
            osc.stop(now + n.time + n.dur);
          });
        }
        else if (type === 'beep') {
          // 優しい電子アラーム（ピピピッ × 2）
          [0, 0.14, 0.28, 0.65, 0.79, 0.93].forEach(offset => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, now + offset);
            gain.gain.setValueAtTime(0.25, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.1);
          });
        }
        else if (type === 'bell') {
          // 卓上ベル（チン！）
          [1046.5, 2093.0, 3135.9].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.28 / (idx + 1), now);
            gain.gain.exponentialRampToValueAtTime(0.0005, now + 1.8);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 1.8);
          });
        }
      }

      playClick() {
        const type = document.getElementById('soundTypeSelect').value;
        if (type === 'mute') return;
        this.unlock();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }
    }

    const soundEngine = new TimerSoundEngine();

    // ==========================================
    // 2. タイマー状態管理（カウントダウン ＆ カウントアップ）
    // ==========================================
    let mode = 'countdown'; // 'countdown' | 'countup'
    let isRunning = false;
    let rafId = null;
    let lastTimestamp = 0;

    // カウントダウン用状態（ミリ秒精度）
    let initialDurationMs = 180 * 1000; // 初期値 3分
    let remainingMs = initialDurationMs;

    // カウントアップ用状態（ミリ秒精度）
    let elapsedMs = 0;
    let lapRecords = [];

    // DOM要素
    const modeCountdownBtn = document.getElementById('modeCountdownBtn');
    const modeCountupBtn = document.getElementById('modeCountupBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const statusBadge = document.getElementById('statusBadge');
    const progressBarWrapper = document.getElementById('progressBarWrapper');
    const progressBar = document.getElementById('progressBar');
    const countupSubInfo = document.getElementById('countupSubInfo');
    const countdownControls = document.getElementById('countdownControls');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const startPauseText = document.getElementById('startPauseText');
    const startPauseIcon = document.getElementById('startPauseIcon');
    const lapBtn = document.getElementById('lapBtn');
    const resetBtn = document.getElementById('resetBtn');
    const lapSidePanel = document.getElementById('lapSidePanel');
    const lapList = document.getElementById('lapList');
    const lapEmpty = document.getElementById('lapEmpty');
    const lapKeyHint = document.getElementById('lapKeyHint');
    const timerStageCard = document.getElementById('timerStageCard');

    // ==========================================
    // 3. 時間フォーマット関数
    // ==========================================
    function formatCountdown(ms) {
      const totalSec = Math.ceil(ms / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function formatCountup(ms) {
      const totalSec = Math.floor(ms / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function formatCountupDetailed(ms) {
      const totalSec = Math.floor(ms / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      const centis = Math.floor((ms % 1000) / 10);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(centis).padStart(2, '0')}`;
    }

    // ==========================================
    // 4. 画面描画・視覚アラート更新
    // ==========================================
    function updateDisplay() {
      if (mode === 'countdown') {
        timeDisplay.textContent = formatCountdown(remainingMs);

        const ratio = initialDurationMs > 0 ? Math.max(0, Math.min(1, remainingMs / initialDurationMs)) : 0;
        progressBar.style.width = `${ratio * 100}%`;

        // 残り時間に応じたカラー変化
        if (remainingMs <= 0) {
          timeDisplay.className = 'font-mono-tech font-black text-rose-600 tracking-tight leading-none text-[5.2rem] sm:text-[9.5rem] md:text-[11.5rem] lg:text-[12.5rem]';
          progressBar.className = 'h-full bg-rose-500 transition-all duration-200 rounded-full';
        } else if (remainingMs <= 10000 && isRunning) {
          timeDisplay.className = 'font-mono-tech font-black text-rose-600 tracking-tight leading-none text-[5.2rem] sm:text-[9.5rem] md:text-[11.5rem] lg:text-[12.5rem]';
          progressBar.className = 'h-full bg-rose-500 transition-all duration-200 rounded-full';
        } else if (ratio <= 0.2 && isRunning) {
          timeDisplay.className = 'font-mono-tech font-black text-amber-500 tracking-tight leading-none text-[5.2rem] sm:text-[9.5rem] md:text-[11.5rem] lg:text-[12.5rem]';
          progressBar.className = 'h-full bg-amber-400 transition-all duration-200 rounded-full';
        } else {
          timeDisplay.className = 'font-mono-tech font-black text-slate-900 tracking-tight leading-none text-[5.2rem] sm:text-[9.5rem] md:text-[11.5rem] lg:text-[12.5rem]';
          progressBar.className = 'h-full bg-sky-500 transition-all duration-200 rounded-full';
        }
      } else {
        timeDisplay.textContent = formatCountup(elapsedMs);
        timeDisplay.className = 'font-mono-tech font-black text-emerald-950 tracking-tight leading-none text-[5.2rem] sm:text-[9.5rem] md:text-[11.5rem] lg:text-[12.5rem]';
      }
    }

    function updateStartPauseButtonUI() {
      if (isRunning) {
        startPauseText.textContent = '一時停止';
        startPauseIcon.setAttribute('data-lucide', 'pause');
        startPauseBtn.className = 'flex-1 py-4 sm:py-5 bg-amber-500 hover:bg-amber-600 active:scale-98 text-white font-black text-xl sm:text-2xl rounded-2xl shadow-lg transition flex items-center justify-center gap-2.5';
        statusBadge.textContent = mode === 'countdown' ? 'COUNTDOWN RUNNING' : 'COUNTUP RUNNING';
        statusBadge.className = mode === 'countdown'
          ? 'px-3.5 py-1 rounded-full bg-sky-600 text-white font-black text-xs tracking-wider animate-pulse'
          : 'px-3.5 py-1 rounded-full bg-emerald-600 text-white font-black text-xs tracking-wider animate-pulse';
      } else {
        startPauseText.textContent = 'スタート';
        startPauseIcon.setAttribute('data-lucide', 'play');
        const bgClass = mode === 'countdown'
          ? 'bg-sky-600 hover:bg-sky-700'
          : 'bg-emerald-600 hover:bg-emerald-700';
        startPauseBtn.className = `flex-1 py-4 sm:py-5 ${bgClass} active:scale-98 text-white font-black text-xl sm:text-2xl rounded-2xl shadow-lg transition flex items-center justify-center gap-2.5`;
        statusBadge.textContent = mode === 'countdown' ? 'COUNTDOWN READY' : 'COUNTUP READY';
        statusBadge.className = mode === 'countdown'
          ? 'px-3.5 py-1 rounded-full bg-sky-50 text-sky-700 border border-sky-200 font-black text-xs tracking-wider'
          : 'px-3.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-black text-xs tracking-wider';
      }
      lucide.createIcons();
    }

    // ==========================================
    // 5. メインループ（requestAnimationFrameによる高精度計測）
    // ==========================================
    function tick(now) {
      if (!isRunning) return;
      const delta = now - lastTimestamp;
      lastTimestamp = now;

      if (mode === 'countdown') {
        remainingMs -= delta;
        if (remainingMs <= 0) {
          remainingMs = 0;
          isRunning = false;
          updateDisplay();
          updateStartPauseButtonUI();
          onCountdownFinished();
          return;
        }
      } else {
        elapsedMs += delta;
      }

      updateDisplay();
      rafId = requestAnimationFrame(tick);
    }

    function onCountdownFinished() {
      statusBadge.textContent = 'TIME UP!';
      statusBadge.className = 'px-3.5 py-1 rounded-full bg-rose-600 text-white font-black text-xs tracking-wider';
      timerStageCard.classList.remove('finish-flash');
      void timerStageCard.offsetWidth;
      timerStageCard.classList.add('finish-flash');

      const soundType = document.getElementById('soundTypeSelect').value;
      soundEngine.play(soundType);
    }

    function toggleStartPause() {
      soundEngine.unlock();
      if (isRunning) {
        isRunning = false;
        cancelAnimationFrame(rafId);
        updateStartPauseButtonUI();
      } else {
        if (mode === 'countdown' && remainingMs <= 0) {
          remainingMs = initialDurationMs;
        }
        timerStageCard.classList.remove('finish-flash');
        isRunning = true;
        lastTimestamp = performance.now();
        updateStartPauseButtonUI();
        rafId = requestAnimationFrame(tick);
      }
    }

    function resetTimer() {
      isRunning = false;
      cancelAnimationFrame(rafId);
      timerStageCard.classList.remove('finish-flash');

      if (mode === 'countdown') {
        remainingMs = initialDurationMs;
      } else {
        elapsedMs = 0;
        clearLaps();
      }
      updateDisplay();
      updateStartPauseButtonUI();
    }

    // ==========================================
    // 6. モード切り替え（カウントダウン ⇄ カウントアップ）
    // ==========================================
    function switchMode(newMode) {
      if (mode === newMode) return;
      isRunning = false;
      cancelAnimationFrame(rafId);
      timerStageCard.classList.remove('finish-flash');
      mode = newMode;

      if (mode === 'countdown') {
        modeCountdownBtn.className = 'px-3.5 sm:px-5 py-1.5 rounded-xl bg-white text-sky-700 font-black text-xs sm:text-sm shadow-xs transition flex items-center gap-1.5';
        modeCountupBtn.className = 'px-3.5 sm:px-5 py-1.5 rounded-xl text-slate-500 hover:text-slate-900 font-black text-xs sm:text-sm transition flex items-center gap-1.5';

        progressBarWrapper.classList.remove('hidden');
        countdownControls.classList.remove('hidden');
        countupSubInfo.classList.add('hidden');
        lapBtn.classList.add('hidden');
        lapSidePanel.classList.add('hidden');
        lapKeyHint.classList.add('hidden');

        remainingMs = initialDurationMs;
      } else {
        modeCountupBtn.className = 'px-3.5 sm:px-5 py-1.5 rounded-xl bg-white text-emerald-700 font-black text-xs sm:text-sm shadow-xs transition flex items-center gap-1.5';
        modeCountdownBtn.className = 'px-3.5 sm:px-5 py-1.5 rounded-xl text-slate-500 hover:text-slate-900 font-black text-xs sm:text-sm transition flex items-center gap-1.5';

        progressBarWrapper.classList.add('hidden');
        countdownControls.classList.add('hidden');
        countupSubInfo.classList.remove('hidden');
        lapBtn.classList.remove('hidden');
        lapSidePanel.classList.remove('hidden');
        lapKeyHint.classList.remove('hidden');

        elapsedMs = 0;
      }

      updateDisplay();
      updateStartPauseButtonUI();
    }

    // ==========================================
    // 7. カウントアップ用タイム記録（ラップ）機能
    // ==========================================
    function recordLap() {
      if (mode !== 'countup') return;
      if (elapsedMs === 0 && !isRunning) return;

      soundEngine.playClick();
      const order = lapRecords.length + 1;
      const timeStr = formatCountupDetailed(elapsedMs);
      lapRecords.push({ order, timeStr });

      lapEmpty.classList.add('hidden');
      const item = document.createElement('div');
      item.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200/80';
      item.innerHTML = `
        <div class="flex items-center gap-2.5">
          <span class="w-6 h-6 rounded-lg bg-emerald-600 text-white font-mono-tech font-black text-xs flex items-center justify-center">${order}</span>
          <span class="text-xs font-bold text-slate-500">${order}番目</span>
        </div>
        <span class="font-mono-tech font-black text-base text-slate-900">${timeStr}</span>
      `;
      lapList.prepend(item);
    }

    function clearLaps() {
      lapRecords = [];
      lapList.innerHTML = '';
      lapList.appendChild(lapEmpty);
      lapEmpty.classList.remove('hidden');
    }

    // ==========================================
    // 8. プリセット・時間調整・現在時刻時計・キーボード操作
    // ==========================================
    function setPresetSeconds(sec) {
      isRunning = false;
      cancelAnimationFrame(rafId);
      timerStageCard.classList.remove('finish-flash');

      initialDurationMs = sec * 1000;
      remainingMs = initialDurationMs;

      document.querySelectorAll('.preset-btn').forEach(btn => {
        if (parseInt(btn.dataset.sec, 10) === sec) {
          btn.className = 'preset-btn px-3 py-1.5 rounded-xl bg-sky-100 text-sky-700 ring-2 ring-sky-400 font-black text-xs sm:text-sm transition';
        } else {
          btn.className = 'preset-btn px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-sky-100 hover:text-sky-700 text-slate-700 font-black text-xs sm:text-sm transition';
        }
      });

      updateDisplay();
      updateStartPauseButtonUI();
    }

    function adjustCountdownSeconds(deltaSec) {
      if (mode !== 'countdown') return;
      const newRemaining = Math.max(5000, remainingMs + deltaSec * 1000);
      remainingMs = newRemaining;
      if (!isRunning || remainingMs > initialDurationMs) {
        initialDurationMs = remainingMs;
      }
      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.className = 'preset-btn px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-sky-100 hover:text-sky-700 text-slate-700 font-black text-xs sm:text-sm transition';
      });
      updateDisplay();
    }

    function updateLiveClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('liveClock').textContent = `${h}:${m}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updateDisplay();
      updateLiveClock();
      setInterval(updateLiveClock, 5000);

      modeCountdownBtn.onclick = () => switchMode('countdown');
      modeCountupBtn.onclick = () => switchMode('countup');

      startPauseBtn.onclick = toggleStartPause;
      resetBtn.onclick = resetTimer;
      lapBtn.onclick = recordLap;
      document.getElementById('clearLapsBtn').onclick = clearLaps;

      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.onclick = () => setPresetSeconds(parseInt(btn.dataset.sec, 10));
      });

      document.getElementById('addMinBtn').onclick = () => adjustCountdownSeconds(60);
      document.getElementById('addTenSecBtn').onclick = () => adjustCountdownSeconds(10);
      document.getElementById('subTenSecBtn').onclick = () => adjustCountdownSeconds(-10);

      document.getElementById('testSoundBtn').onclick = () => {
        const type = document.getElementById('soundTypeSelect').value;
        soundEngine.play(type === 'mute' ? 'chime' : type);
      };

      document.getElementById('fullscreenBtn').onclick = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      };

      // キーボードショートカット
      window.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') return;
        if (e.code === 'Space') {
          e.preventDefault();
          toggleStartPause();
        } else if (e.code === 'KeyR') {
          e.preventDefault();
          resetTimer();
        } else if (e.code === 'KeyL' && mode === 'countup') {
          e.preventDefault();
          recordLap();
        }
      });
    });
  </script>
</body>
</html>
