  <script>
    // ==========================================
    // 1. Web Audio API 効果音エンジン（ドラムロール ＆ ファンファーレ）
    // ==========================================
    class LotterySoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.rollInterval = null;
      }

      unlock() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      startDrumRoll() {
        this.stopDrumRoll();
        if (!this.enabled) return;
        this.unlock();

        this.rollInterval = setInterval(() => {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160 + Math.random() * 40, now);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.055);
        }, 65);
      }

      stopDrumRoll() {
        if (this.rollInterval) {
          clearInterval(this.rollInterval);
          this.rollInterval = null;
        }
      }

      playFanfare() {
        this.stopDrumRoll();
        if (!this.enabled) return;
        this.unlock();

        const now = this.ctx.currentTime;
        // ジャン！ジャジャン！（ド・ミ・ソ・高いド）
        const notes = [
          { freq: 523.25, time: 0.0, dur: 0.14 },
          { freq: 659.25, time: 0.12, dur: 0.14 },
          { freq: 783.99, time: 0.24, dur: 0.14 },
          { freq: 1046.50, time: 0.36, dur: 0.65 }
        ];
        notes.forEach(n => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.freq, now + n.time);
          gain.gain.setValueAtTime(0.28, now + n.time);
          gain.gain.exponentialRampToValueAtTime(0.001, now + n.time + n.dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + n.time);
          osc.stop(now + n.time + n.dur);
        });
      }
    }

    const sound = new LotterySoundEngine();

    // ==========================================
    // 2. 状態管理 ＆ ローカルストレージ記憶
    // ==========================================
    const ROSTER_STORAGE_KEY = 'senseibox_lottery_roster_v1';
    const CUSTOM_STORAGE_KEY = 'senseibox_lottery_custom_v1';

    let appMode = 'lottery'; // 'lottery' | 'group'
    let sourceType = 'number'; // 'number' | 'roster' | 'custom'
    let isPrivacyMode = false; // true = 名簿でも番号表示にする
    let isSpinning = false;

    let absentNumbers = new Set(); // 出席番号の欠席者 Set<number>
    let absentRosterIndices = new Set(); // 名簿の欠席者 Set<number>
    let drawnIds = new Set(); // 当選済みID Set<string>

    const CUSTOM_PRESETS = {
      reward: "給食おかわり優先券\n席替えリクエスト権\n好きなBGMリクエスト権\n先生とじゃんけん勝負\n宿題1つパス券\n今日のリーダー任命",
      seat: "1番目に席を選べる権\n2番目に席を選べる権\n3番目に席を選べる権\n窓側の列から選べる権\n廊下側の列から選べる権\n一番後ろの列から選べる権",
      role: "黒板消しマスター\n配りもの隊長\n号令リーダー\n電気・カーテン係\nパソコン準備係\n整列チェック係"
    };

    // ==========================================
    // 3. 候補プール生成ロジック
    // ==========================================
    function getAllActiveCandidates() {
      if (sourceType === 'number') {
        const max = Math.max(2, Math.min(60, parseInt(document.getElementById('maxNumberInput').value, 10) || 32));
        const list = [];
        for (let i = 1; i <= max; i++) {
          if (!absentNumbers.has(i)) {
            list.push({
              id: `num_${i}`,
              display: `${i}番`,
              privateDisplay: `${i}番`
            });
          }
        }
        return list;
      }

      if (sourceType === 'roster') {
        const lines = document.getElementById('rosterTextarea').value
          .split('\n')
          .map(s => s.trim())
          .filter(Boolean);
        const list = [];
        lines.forEach((name, idx) => {
          if (!absentRosterIndices.has(idx)) {
            list.push({
              id: `ros_${idx}_${name}`,
              display: name,
              privateDisplay: `${idx + 1}番`
            });
          }
        });
        return list;
      }

      // custom
      const lines = document.getElementById('customTextarea').value
        .split('\n')
        .map(s => s.trim())
        .filter(Boolean);
      return lines.map((item, idx) => ({
        id: `cus_${idx}_${item}`,
        display: item,
        privateDisplay: item
      }));
    }

    function getAvailableLotteryPool() {
      const all = getAllActiveCandidates();
      const noRepeat = document.getElementById('noRepeatCheck').checked;
      if (!noRepeat) return all;
      return all.filter(item => !drawnIds.has(item.id));
    }

    function formatCandidateText(item) {
      return isPrivacyMode ? item.privateDisplay : item.display;
    }

    function updateRemainingCounts() {
      const pool = getAvailableLotteryPool();
      document.getElementById('remainingPoolCount').textContent = pool.length;
      document.getElementById('presentationRemainingText').textContent = `残り ${pool.length} 件`;
    }

    // ==========================================
    // 4. 出席番号タイル ＆ 名簿欠席チェック描画
    // ==========================================
    function renderNumberGrid() {
      const max = Math.max(2, Math.min(60, parseInt(document.getElementById('maxNumberInput').value, 10) || 32));
      const grid = document.getElementById('numberGrid');
      grid.innerHTML = '';

      for (let i = 1; i <= max; i++) {
        const isAbsent = absentNumbers.has(i);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = i;
        btn.className = isAbsent
          ? 'py-1.5 rounded-lg bg-slate-200 text-slate-400 line-through font-mono-tech font-bold text-xs transition'
          : 'py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 font-mono-tech font-black text-xs transition';
        btn.onclick = () => {
          if (absentNumbers.has(i)) absentNumbers.delete(i);
          else absentNumbers.add(i);
          renderNumberGrid();
          updateRemainingCounts();
        };
        grid.appendChild(btn);
      }
      updateRemainingCounts();
    }

    function renderRosterCheckList() {
      const lines = document.getElementById('rosterTextarea').value
        .split('\n')
        .map(s => s.trim())
        .filter(Boolean);
      document.getElementById('rosterCountLabel').textContent = `登録人数：${lines.length}人（欠席 ${absentRosterIndices.size}人）`;

      const container = document.getElementById('rosterAbsentCheckList');
      container.innerHTML = '';
      lines.forEach((name, idx) => {
        const isAbsent = absentRosterIndices.has(idx);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = `${idx + 1}.${name}`;
        btn.className = isAbsent
          ? 'px-2 py-1 rounded-lg bg-slate-200 text-slate-400 line-through text-[11px] font-bold'
          : 'px-2 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 text-[11px] font-bold hover:border-amber-400';
        btn.onclick = () => {
          if (absentRosterIndices.has(idx)) absentRosterIndices.delete(idx);
          else absentRosterIndices.add(idx);
          renderRosterCheckList();
          updateRemainingCounts();
        };
        container.appendChild(btn);
      });
      updateRemainingCounts();
    }

    // ==========================================
    // 5. 抽選実行（ドラムロール演出 ＆ 複数人同時選出）
    // ==========================================
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function runLottery() {
      if (isSpinning) return;
      const pool = getAvailableLotteryPool();
      if (pool.length === 0) {
        alert('くじの候補が0件です。「履歴リセット」を押すか、欠席設定を確認してください。');
        return;
      }

      const drawCount = Math.min(pool.length, parseInt(document.getElementById('drawCountSelect').value, 10) || 1);
      const speedMode = document.getElementById('animationSpeedSelect').value;

      const winners = shuffleArray(pool).slice(0, drawCount);

      const placeholder = document.getElementById('lotteryPlaceholder');
      const singleBox = document.getElementById('singleWinnerBox');
      const singleText = document.getElementById('singleWinnerText');
      const winnerSubLabel = document.getElementById('winnerSubLabel');
      const multiGrid = document.getElementById('multiWinnerGrid');

      placeholder.classList.add('hidden');

      const finishDraw = () => {
        isSpinning = false;
        sound.playFanfare();

        winners.forEach(w => drawnIds.add(w.id));
        renderDrawnHistory();
        updateRemainingCounts();

        if (drawCount === 1) {
          multiGrid.classList.add('hidden');
          singleBox.classList.remove('hidden');
          winnerSubLabel.textContent = '🎉 当選！';
          singleText.textContent = formatCandidateText(winners[0]);
          singleText.classList.remove('animate-pop-in');
          void singleText.offsetWidth;
          singleText.classList.add('animate-pop-in');
        } else {
          singleBox.classList.add('hidden');
          multiGrid.classList.remove('hidden');
          multiGrid.innerHTML = '';
          winners.forEach((w, idx) => {
            const card = document.createElement('div');
            card.className = 'p-5 rounded-2xl bg-amber-50 border-2 border-amber-300 text-center shadow-xs animate-pop-in';
            card.innerHTML = `
              <span class="inline-block px-2.5 py-0.5 rounded-full bg-amber-500 text-white font-mono-tech font-black text-xs mb-2">${idx + 1}人目</span>
              <div class="text-2xl sm:text-4xl font-black text-slate-900 break-words">${escapeHtml(formatCandidateText(w))}</div>
            `;
            multiGrid.appendChild(card);
          });
        }
      };

      if (speedMode === 'instant') {
        finishDraw();
        return;
      }

      // スロット回転演出
      isSpinning = true;
      sound.startDrumRoll();
      multiGrid.classList.add('hidden');
      singleBox.classList.remove('hidden');
      winnerSubLabel.textContent = '抽選中...';

      const duration = speedMode === 'quick' ? 800 : 1900;
      const spinTimer = setInterval(() => {
        const randItem = pool[Math.floor(Math.random() * pool.length)];
        singleText.textContent = formatCandidateText(randItem);
      }, 60);

      setTimeout(() => {
        clearInterval(spinTimer);
        finishDraw();
      }, duration);
    }

    function renderDrawnHistory() {
      const container = document.getElementById('drawnHistoryBadges');
      if (drawnIds.size === 0) {
        container.innerHTML = '<span class="text-[11px] text-slate-400 font-bold">まだくじを引いていません</span>';
        return;
      }
      const allMap = new Map(getAllActiveCandidates().map(c => [c.id, c]));
      container.innerHTML = '';
      drawnIds.forEach(id => {
        const item = allMap.get(id);
        const label = item ? formatCandidateText(item) : id.replace(/^num_|^ros_\d+_|^cus_\d+_/, '');
        const badge = document.createElement('span');
        badge.className = 'px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 font-bold text-[11px]';
        badge.textContent = label;
        container.appendChild(badge);
      });
    }

    // ==========================================
    // 6. グループ（班）自動分け実行
    // ==========================================
    function runGrouping() {
      const candidates = getAllActiveCandidates();
      if (candidates.length < 2) {
        alert('グループ分けするには2人以上のメンバーが必要です。');
        return;
      }

      const groupCount = Math.max(2, Math.min(20, parseInt(document.getElementById('customGroupCountInput').value, 10) || 6));
      const shuffled = shuffleArray(candidates);
      const groups = Array.from({ length: groupCount }, () => []);

      shuffled.forEach((member, idx) => {
        groups[idx % groupCount].push(member);
      });

      sound.playFanfare();

      document.getElementById('groupPlaceholder').classList.add('hidden');
      const grid = document.getElementById('groupCardsGrid');
      grid.classList.remove('hidden');
      grid.innerHTML = '';

      const colors = [
        'border-rose-300 bg-rose-50/60',
        'border-sky-300 bg-sky-50/60',
        'border-emerald-300 bg-emerald-50/60',
        'border-amber-300 bg-amber-50/60',
        'border-violet-300 bg-violet-50/60',
        'border-pink-300 bg-pink-50/60'
      ];
      const badgeColors = [
        'bg-rose-500',
        'bg-sky-600',
        'bg-emerald-600',
        'bg-amber-500',
        'bg-violet-600',
        'bg-pink-500'
      ];

      groups.forEach((members, gIdx) => {
        const card = document.createElement('div');
        card.className = `p-4 rounded-2xl border-2 ${colors[gIdx % colors.length]} shadow-2xs animate-pop-in`;
        const memberHtml = members
          .map(m => `<span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200/80 font-black text-sm sm:text-base text-slate-800 shadow-2xs">${escapeHtml(formatCandidateText(m))}</span>`)
          .join('');

        card.innerHTML = `
          <div class="flex items-center justify-between mb-2.5">
            <span class="px-3 py-0.5 rounded-full ${badgeColors[gIdx % badgeColors.length]} text-white font-black text-xs sm:text-sm">${gIdx + 1}班（グループ）</span>
            <span class="text-xs font-bold text-slate-500">${members.length}人</span>
          </div>
          <div class="flex flex-wrap gap-1.5">
            ${memberHtml}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ==========================================
    // 7. UIイベント・モード切替・発表画面モード
    // ==========================================
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function switchAppMode(newMode) {
      appMode = newMode;
      const modeLotteryBtn = document.getElementById('modeLotteryBtn');
      const modeGroupBtn = document.getElementById('modeGroupBtn');

      if (appMode === 'lottery') {
        modeLotteryBtn.className = 'px-3.5 sm:px-5 py-1.5 rounded-xl bg-white text-amber-700 font-black text-xs sm:text-sm shadow-xs transition flex items-center gap-1.5';
        modeGroupBtn.className = 'px-3.5 sm:px-5 py-1.5 rounded-xl text-slate-500 hover:text-slate-900 font-black text-xs sm:text-sm transition flex items-center gap-1.5';

        document.getElementById('lotteryRulesBox').classList.remove('hidden');
        document.getElementById('groupRulesBox').classList.add('hidden');
        document.getElementById('historyCard').classList.remove('hidden');
        document.getElementById('lotteryResultStage').classList.remove('hidden');
        document.getElementById('groupResultStage').classList.add('hidden');
        document.getElementById('ruleSectionTitle').textContent = '引き方・演出の設定';
        document.getElementById('stageHeadingInput').value = 'ドキドキ！くじ引きタイム';
        document.getElementById('mainActionBtnText').textContent = 'くじを引く！';
      } else {
        modeGroupBtn.className = 'px-3.5 sm:px-5 py-1.5 rounded-xl bg-white text-emerald-700 font-black text-xs sm:text-sm shadow-xs transition flex items-center gap-1.5';
        modeLotteryBtn.className = 'px-3.5 sm:px-5 py-1.5 rounded-xl text-slate-500 hover:text-slate-900 font-black text-xs sm:text-sm transition flex items-center gap-1.5';

        document.getElementById('groupRulesBox').classList.remove('hidden');
        document.getElementById('lotteryRulesBox').classList.add('hidden');
        document.getElementById('historyCard').classList.add('hidden');
        document.getElementById('groupResultStage').classList.remove('hidden');
        document.getElementById('lotteryResultStage').classList.add('hidden');
        document.getElementById('ruleSectionTitle').textContent = 'グループ分けの設定';
        document.getElementById('stageHeadingInput').value = 'グループ（班）発表！';
        document.getElementById('mainActionBtnText').textContent = 'グループ分けを実行！';
      }
    }

    function togglePrivacyMode() {
      isPrivacyMode = !isPrivacyMode;
      const label = document.getElementById('privacyLabel');
      const icon = document.getElementById('privacyIcon');
      const btn = document.getElementById('privacyToggleBtn');

      if (isPrivacyMode) {
        label.textContent = '番号のみ（隠す）';
        icon.setAttribute('data-lucide', 'eye-off');
        btn.className = 'px-2.5 py-1.5 rounded-xl border border-amber-300 bg-amber-50 text-amber-800 text-xs font-black transition flex items-center gap-1';
      } else {
        label.textContent = '名前表示';
        icon.setAttribute('data-lucide', 'eye');
        btn.className = 'px-2.5 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 text-xs font-bold transition flex items-center gap-1';
      }
      lucide.createIcons();
      renderDrawnHistory();
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      // 保存済み名簿・カスタムくじの復元
      const savedRoster = localStorage.getItem(ROSTER_STORAGE_KEY);
      if (savedRoster) document.getElementById('rosterTextarea').value = savedRoster;
      const savedCustom = localStorage.getItem(CUSTOM_STORAGE_KEY);
      document.getElementById('customTextarea').value = savedCustom || CUSTOM_PRESETS.reward;

      renderNumberGrid();
      renderRosterCheckList();

      // モード切替
      document.getElementById('modeLotteryBtn').onclick = () => switchAppMode('lottery');
      document.getElementById('modeGroupBtn').onclick = () => switchAppMode('group');

      // 入力ソースタブ切替
      document.querySelectorAll('.source-tab').forEach(tab => {
        tab.onclick = () => {
          sourceType = tab.dataset.source;
          document.querySelectorAll('.source-tab').forEach(t => {
            t.className = 'source-tab py-1.5 rounded-lg text-slate-500 hover:text-slate-900 transition';
          });
          tab.className = 'source-tab py-1.5 rounded-lg bg-white text-slate-900 shadow-2xs transition';

          document.getElementById('sourceNumberPanel').classList.toggle('hidden', sourceType !== 'number');
          document.getElementById('sourceRosterPanel').classList.toggle('hidden', sourceType !== 'roster');
          document.getElementById('sourceCustomPanel').classList.toggle('hidden', sourceType !== 'custom');
          updateRemainingCounts();
        };
      });

      // 出席番号・欠席クリア
      document.getElementById('maxNumberInput').onchange = () => {
        absentNumbers.clear();
        renderNumberGrid();
      };
      document.getElementById('clearAbsentBtn').onclick = () => {
        absentNumbers.clear();
        renderNumberGrid();
      };

      // 児童名簿入力・記憶
      document.getElementById('rosterTextarea').addEventListener('input', (e) => {
        localStorage.setItem(ROSTER_STORAGE_KEY, e.target.value);
        absentRosterIndices.clear();
        renderRosterCheckList();
      });
      document.getElementById('sampleRosterBtn').onclick = () => {
        const sample = "あおき はると\nいとう めい\nうえだ れん\nえぐち ひなた\nおおた そうた\nかとう あおい\nきむら ゆうと\nくぼた さくら";
        document.getElementById('rosterTextarea').value = sample;
        localStorage.setItem(ROSTER_STORAGE_KEY, sample);
        absentRosterIndices.clear();
        renderRosterCheckList();
      };
      document.getElementById('toggleRosterCheckListBtn').onclick = () => {
        document.getElementById('rosterAbsentCheckList').classList.toggle('hidden');
      };

      // カスタムくじプリセット
      document.querySelectorAll('.custom-preset-btn').forEach(btn => {
        btn.onclick = () => {
          const val = CUSTOM_PRESETS[btn.dataset.preset];
          document.getElementById('customTextarea').value = val;
          localStorage.setItem(CUSTOM_STORAGE_KEY, val);
          updateRemainingCounts();
        };
      });
      document.getElementById('customTextarea').addEventListener('input', (e) => {
        localStorage.setItem(CUSTOM_STORAGE_KEY, e.target.value);
        updateRemainingCounts();
      });

      // グループ数ボタン
      document.querySelectorAll('.gcount-btn').forEach(btn => {
        btn.onclick = () => {
          document.getElementById('customGroupCountInput').value = btn.dataset.gcount;
          document.querySelectorAll('.gcount-btn').forEach(b => {
            b.className = 'gcount-btn py-2 rounded-xl bg-slate-100 text-slate-700 font-black text-xs transition';
          });
          btn.className = 'gcount-btn py-2 rounded-xl bg-amber-100 text-amber-800 ring-2 ring-amber-400 font-black text-xs transition';
        };
      });

      // 発表画面のみ（テレビ投影モード）の出入り
      document.getElementById('enterPresentationBtn').onclick = () => {
        document.body.classList.add('presentation-mode');
      };
      document.getElementById('exitPresentationBtn').onclick = () => {
        document.body.classList.remove('presentation-mode');
      };
      document.getElementById('presPrivacyBtn').onclick = togglePrivacyMode;

      // プライバシー・効果音
      document.getElementById('privacyToggleBtn').onclick = togglePrivacyMode;
      document.getElementById('soundToggleBtn').onclick = () => {
        sound.enabled = !sound.enabled;
        const icon = document.getElementById('soundIcon');
        icon.setAttribute('data-lucide', sound.enabled ? 'volume-2' : 'volume-x');
        lucide.createIcons();
      };

      // メイン実行・リセット
      document.getElementById('mainActionBtn').onclick = () => {
        if (appMode === 'lottery') runLottery();
        else runGrouping();
      };

      document.getElementById('resetDrawnHistoryBtn').onclick = () => {
        drawnIds.clear();
        renderDrawnHistory();
        updateRemainingCounts();
      };

      document.getElementById('stageResetBtn').onclick = () => {
        drawnIds.clear();
        renderDrawnHistory();
        updateRemainingCounts();
        document.getElementById('singleWinnerBox').classList.add('hidden');
        document.getElementById('multiWinnerGrid').classList.add('hidden');
        document.getElementById('lotteryPlaceholder').classList.remove('hidden');
        document.getElementById('groupCardsGrid').classList.add('hidden');
        document.getElementById('groupPlaceholder').classList.remove('hidden');
      };

      // キーボードショートカット
      window.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'SELECT') return;
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          if (appMode === 'lottery') runLottery();
          else runGrouping();
        } else if (e.code === 'Escape' && document.body.classList.contains('presentation-mode')) {
          document.body.classList.remove('presentation-mode');
        }
      });
    });
  </script>
</body>
</html>
