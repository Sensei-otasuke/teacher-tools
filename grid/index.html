      A3: { w: 297, h: 420 },
      B5: { w: 182, h: 257 },
      B4: { w: 257, h: 364 }
    };

    // カラーパレット（黒・青・緑 × 濃さ3段階）
    const COLOR_PALETTES = {
      black: {
        light: { main: '#94a3b8', sub: '#cbd5e1', bold: '#475569', text: '#334155' },
        normal: { main: '#475569', sub: '#94a3b8', bold: '#1e293b', text: '#1e293b' },
        dark: { main: '#1e293b', sub: '#64748b', bold: '#0f172a', text: '#0f172a' }
      },
      blue: {
        light: { main: '#7dd3fc', sub: '#bae6fd', bold: '#0284c7', text: '#0369a1' },
        normal: { main: '#0ea5e9', sub: '#7dd3fc', bold: '#0369a1', text: '#0369a1' },
        dark: { main: '#0284c7', sub: '#38bdf8', bold: '#075985', text: '#075985' }
      },
      green: {
        light: { main: '#6ee7b7', sub: '#a7f3d0', bold: '#059669', text: '#047857' },
        normal: { main: '#10b981', sub: '#6ee7b7', bold: '#047857', text: '#047857' },
        dark: { main: '#059669', sub: '#34d399', bold: '#065f46', text: '#065f46' }
      }
    };

    // ==========================================
    // 2. アプリ状態管理
    // ==========================================
    const state = {
      paper: 'A4',
      orientation: 'portrait', // 'portrait' | 'landscape'
      marginMm: 12,
      sizeMode: 'mm', // 'mm' | 'count'
      cellMm: 10,
      colsCount: 20,
      rowsCount: 20,
      layoutType: 'grid', // 'grid' | 'genkou' | 'kanji_v' | 'kanji_h'
      crossLeader: false,
      boldEvery5: false,
      color: 'black', // 'black' | 'blue' | 'green'
      intensity: 'normal', // 'light' | 'normal' | 'dark'
      showHeader: true,
      sheetTitle: '',
      showScale: true,
      zoomMode: 'fit' // 'fit' | '100'
    };

    // ==========================================
    // 3. 印刷CSS（@page）同期 ＆ プレビュー倍率調整
    // ==========================================
    function syncPrintPageRule() {
      const styleEl = document.getElementById('dynamicPageStyle');
      styleEl.textContent = `@page { size: ${state.paper} ${state.orientation}; margin: 0; }`;
    }

    function applyPreviewScale() {
      const viewport = document.getElementById('previewViewport');
      const sheet = document.getElementById('paperSheet');
      const base = PAPER_SIZES[state.paper];
      const paperW = state.orientation === 'portrait' ? base.w : base.h;
      const paperH = state.orientation === 'portrait' ? base.h : base.w;

      if (state.zoomMode === '100') {
        sheet.style.transform = 'scale(1)';
        sheet.style.marginBottom = '0px';
        return;
      }

      const pxPerMm = 3.7795275591;
      const sheetPxW = paperW * pxPerMm;
      const sheetPxH = paperH * pxPerMm;
      const availW = Math.max(260, viewport.clientWidth - 48);

      const scale = Math.min(1, availW / sheetPxW);
      sheet.style.transform = `scale(${scale})`;
      const reducedHeight = sheetPxH * (1 - scale);
      sheet.style.marginBottom = `-${reducedHeight}px`;
    }

    // ==========================================
    // 4. SVGベクター方眼・原稿用紙レンダリングエンジン
    // ==========================================
    function renderSheet() {
      syncPrintPageRule();

      const base = PAPER_SIZES[state.paper];
      const paperW = state.orientation === 'portrait' ? base.w : base.h;
      const paperH = state.orientation === 'portrait' ? base.h : base.w;
      const margin = state.marginMm;

      const palette = COLOR_PALETTES[state.color][state.intensity];

      const headerH = state.showHeader ? 14 : 0;
      const footerH = state.showScale ? 8 : 0;

      const availW = paperW - margin * 2;
      const availH = paperH - margin * 2 - headerH - footerH;

      let cellW = state.cellMm;
      let cellH = state.cellMm;
      let cols = 10;
      let rows = 10;

      // 漢字練習帳のふりがな欄幅（マスの36%）
      const furiganaRatio = 0.36;
      // 原稿用紙の行間すき間比率（マスの24%）と中央綴じ目比率（マスの90%）
      const genkouGapRatio = 0.24;
      const genkouCenterRatio = 0.9;

      if (state.layoutType === 'genkou') {
        // 原稿用紙モード（用紙いっぱいに美しく広がる専用レイアウト）
        if (state.sizeMode === 'mm') {
          cellH = Math.max(4, Math.min(40, state.cellMm));
          cellW = cellH;
          rows = Math.max(1, Math.floor(availH / cellH));
          const gapW = cellW * genkouGapRatio;
          const centerW = cellW * genkouCenterRatio;
          // 1列あたり (cellW + gapW) で何列入るか計算
          cols = Math.max(2, Math.floor((availW - centerW + gapW) / (cellW + gapW)));
        } else {
          cols = Math.max(2, state.colsCount);
          rows = Math.max(1, state.rowsCount);
          cellH = +(availH / rows).toFixed(2);
          // 横幅いっぱいに広がるよう1マスの横幅を自動フィット（正方形〜やや横長で用紙全面を使う）
          const hasCenter = cols >= 4;
          const totalRatioW = cols + (cols - 1) * genkouGapRatio + (hasCenter ? (genkouCenterRatio - genkouGapRatio) : 0);
          cellW = +(availW / totalRatioW).toFixed(2);
          document.getElementById('calculatedMmInfo').textContent =
            `原稿用紙1マスのサイズ：横 ${cellW.toFixed(1)}mm × 縦 ${cellH.toFixed(1)}mm`;
        }

        const gapW = cellW * genkouGapRatio;
        const hasCenter = cols >= 4;
        const halfCol = Math.floor(cols / 2);
        const centerW = hasCenter ? cellW * genkouCenterRatio : gapW;

        // 各列の開始X座標と幅を計算
        const colRects = [];
        let curX = 0;
        for (let c = 0; c < cols; c++) {
          colRects.push({ x: curX, w: cellW });
          if (c < cols - 1) {
            curX += cellW + (hasCenter && c === halfCol - 1 ? centerW : gapW);
          } else {
            curX += cellW;
          }
        }
        const totalGridW = +curX.toFixed(3);
        const totalGridH = +(rows * cellH).toFixed(3);

        document.getElementById('paperSpecBadge').textContent =
          `${state.paper} ${state.orientation === 'portrait' ? '縦' : '横'}（${paperW}×${paperH}mm）`;
        document.getElementById('gridCountBadge').textContent =
          `原稿用紙 ${cols}行 × ${rows}字（${cols * rows}字詰め）`;

        const svgParts = [];

        // 各行（縦の列）の枠線と横仕切り線を描画
        for (let c = 0; c < cols; c++) {
          const cx = +colRects[c].x.toFixed(3);
          const cw = +colRects[c].w.toFixed(3);

          // 列の外枠
          svgParts.push(
            `<rect x="${cx}" y="0" width="${cw}" height="${totalGridH}" fill="none" stroke="${palette.main}" stroke-width="0.28"/>`
          );

          // マスごとの横線
          for (let r = 1; r < rows; r++) {
            const y = +(r * cellH).toFixed(3);
            svgParts.push(
              `<line x1="${cx}" y1="${y}" x2="${+(cx + cw).toFixed(3)}" y2="${y}" stroke="${palette.main}" stroke-width="0.22"/>`
            );
          }

          // 十字リーダー（低学年原稿用紙用）
          if (state.crossLeader) {
            const dash = +(Math.max(0.5, Math.min(cw, cellH) * 0.07)).toFixed(2);
            const midX = +(cx + cw / 2).toFixed(3);
            for (let r = 0; r < rows; r++) {
              const y1 = +(r * cellH).toFixed(3);
              const y2 = +((r + 1) * cellH).toFixed(3);
              const midY = +(y1 + cellH / 2).toFixed(3);
              svgParts.push(
                `<line x1="${midX}" y1="${y1}" x2="${midX}" y2="${y2}" stroke="${palette.sub}" stroke-width="0.18" stroke-dasharray="${dash},${dash}"/>`,
                `<line x1="${cx}" y1="${midY}" x2="${+(cx + cw).toFixed(3)}" y2="${midY}" stroke="${palette.sub}" stroke-width="0.18" stroke-dasharray="${dash},${dash}"/>`
              );
            }
          }
        }

        // 中央の綴じ目スペースに魚尾（ぎょび）マークを描画
        if (hasCenter) {
          const leftEnd = colRects[halfCol - 1].x + cellW;
          const rightStart = colRects[halfCol].x;
          const centerMid = +((leftEnd + rightStart) / 2).toFixed(3);
          const gyobiW = +((rightStart - leftEnd) * 0.42).toFixed(3);
          const topY = +(totalGridH * 0.16).toFixed(3);
          const botY = +(totalGridH * 0.84).toFixed(3);

          // 上下の魚尾（リボン型）＋中央線
          svgParts.push(
            `<line x1="${centerMid}" y1="0" x2="${centerMid}" y2="${topY}" stroke="${palette.main}" stroke-width="0.22" stroke-dasharray="1.2,1.2"/>`,
            `<polygon points="${centerMid - gyobiW / 2},${topY} ${centerMid + gyobiW / 2},${topY} ${centerMid + gyobiW / 2},${topY + gyobiW * 1.4} ${centerMid},${topY + gyobiW * 0.8} ${centerMid - gyobiW / 2},${topY + gyobiW * 1.4}" fill="${palette.main}"/>`,
            `<polygon points="${centerMid - gyobiW / 2},${botY} ${centerMid + gyobiW / 2},${botY} ${centerMid + gyobiW / 2},${botY - gyobiW * 1.4} ${centerMid},${botY - gyobiW * 0.8} ${centerMid - gyobiW / 2},${botY - gyobiW * 1.4}" fill="${palette.main}"/>`,
            `<line x1="${centerMid}" y1="${botY}" x2="${centerMid}" y2="${totalGridH}" stroke="${palette.main}" stroke-width="0.22" stroke-dasharray="1.2,1.2"/>`
          );
        }

        // 全体の外枠（二重線風の外枠）
        const outerPad = 1.2;
        svgParts.push(
          `<rect x="${-outerPad}" y="${-outerPad}" width="${+(totalGridW + outerPad * 2).toFixed(3)}" height="${+(totalGridH + outerPad * 2).toFixed(3)}" fill="none" stroke="${palette.bold}" stroke-width="0.45"/>`
        );

        renderHtmlToSheet(paperW, paperH, margin, headerH, footerH, palette, totalGridW, totalGridH, svgParts, outerPad + 0.3);
        return;
      }

      // ==========================================
      // 通常方眼・漢字練習帳モード
      // ==========================================
      if (state.sizeMode === 'mm') {
        cellW = Math.max(3, Math.min(50, state.cellMm));
        cellH = cellW;

        if (state.layoutType === 'kanji_v') {
          const unitW = cellW * (1 + furiganaRatio);
          cols = Math.max(1, Math.floor(availW / unitW));
          rows = Math.max(1, Math.floor(availH / cellH));
        } else if (state.layoutType === 'kanji_h') {
          const unitH = cellH * (1 + furiganaRatio);
          cols = Math.max(1, Math.floor(availW / cellW));
          rows = Math.max(1, Math.floor(availH / unitH));
        } else {
          cols = Math.max(1, Math.floor(availW / cellW));
          rows = Math.max(1, Math.floor(availH / cellH));
        }
      } else {
        cols = Math.max(1, state.colsCount);
        rows = Math.max(1, state.rowsCount);

        let maxCellW = availW / cols;
        let maxCellH = availH / rows;

        if (state.layoutType === 'kanji_v') {
          maxCellW = availW / (cols * (1 + furiganaRatio));
        } else if (state.layoutType === 'kanji_h') {
          maxCellH = availH / (rows * (1 + furiganaRatio));
        }

        const fitSize = Math.floor(Math.min(maxCellW, maxCellH) * 10) / 10;
        cellW = Math.max(3, fitSize);
        cellH = cellW;
        document.getElementById('calculatedMmInfo').textContent = `自動計算された1マスのサイズ：${cellW.toFixed(1)} mm`;
      }

      const unitW = state.layoutType === 'kanji_v' ? cellW * (1 + furiganaRatio) : cellW;
      const unitH = state.layoutType === 'kanji_h' ? cellH * (1 + furiganaRatio) : cellH;

      const totalGridW = +(cols * unitW).toFixed(3);
      const totalGridH = +(rows * unitH).toFixed(3);

      document.getElementById('paperSpecBadge').textContent =
        `${state.paper} ${state.orientation === 'portrait' ? '縦' : '横'}（${paperW}×${paperH}mm）`;
      document.getElementById('gridCountBadge').textContent =
        `横${cols} × 縦${rows}マス（1マス ${cellW}mm）`;

      const svgParts = [];

      // 1. 縦線
      for (let c = 0; c < cols; c++) {
        const baseX = c * unitW;
        if (c > 0) {
          const x = +baseX.toFixed(3);
          const isBold = state.boldEvery5 && state.layoutType === 'grid' && c % 5 === 0;
          svgParts.push(
            `<line x1="${x}" y1="0" x2="${x}" y2="${totalGridH}" stroke="${isBold ? palette.bold : palette.main}" stroke-width="${isBold ? '0.45' : '0.24'}"/>`
          );
        }
        if (state.layoutType === 'kanji_v') {
          const sepX = +(baseX + cellW).toFixed(3);
          svgParts.push(
            `<line x1="${sepX}" y1="0" x2="${sepX}" y2="${totalGridH}" stroke="${palette.main}" stroke-width="0.24"/>`
          );
        }
      }

      // 2. 横線
      for (let r = 0; r < rows; r++) {
        const baseY = r * unitH;
        if (r > 0) {
          const y = +baseY.toFixed(3);
          const isBold = state.boldEvery5 && state.layoutType === 'grid' && r % 5 === 0;
          svgParts.push(
            `<line x1="0" y1="${y}" x2="${totalGridW}" y2="${y}" stroke="${isBold ? palette.bold : palette.main}" stroke-width="${isBold ? '0.45' : '0.24'}"/>`
          );
        }
        if (state.layoutType === 'kanji_h') {
          const sepY = +(baseY + cellH * furiganaRatio).toFixed(3);
          svgParts.push(
            `<line x1="0" y1="${sepY}" x2="${totalGridW}" y2="${sepY}" stroke="${palette.main}" stroke-width="0.24"/>`
          );
        }
      }

      // 3. 十字リーダー
      if (state.crossLeader) {
        const dash = +(Math.max(0.5, cellW * 0.07)).toFixed(2);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const mainX = c * unitW;
            const mainY = state.layoutType === 'kanji_h' ? r * unitH + cellH * furiganaRatio : r * unitH;
            const midX = +(mainX + cellW / 2).toFixed(3);
            const midY = +(mainY + cellH / 2).toFixed(3);
            const x1 = +mainX.toFixed(3);
            const x2 = +(mainX + cellW).toFixed(3);
            const y1 = +mainY.toFixed(3);
            const y2 = +(mainY + cellH).toFixed(3);
            svgParts.push(
              `<line x1="${midX}" y1="${y1}" x2="${midX}" y2="${y2}" stroke="${palette.sub}" stroke-width="0.2" stroke-dasharray="${dash},${dash}"/>`,
              `<line x1="${x1}" y1="${midY}" x2="${x2}" y2="${midY}" stroke="${palette.sub}" stroke-width="0.2" stroke-dasharray="${dash},${dash}"/>`
            );
          }
        }
      }

      // 4. 外枠
      svgParts.push(
        `<rect x="0" y="0" width="${totalGridW}" height="${totalGridH}" fill="none" stroke="${palette.bold}" stroke-width="0.4"/>`
      );

      renderHtmlToSheet(paperW, paperH, margin, headerH, footerH, palette, totalGridW, totalGridH, svgParts, 0.25);
    }

    function renderHtmlToSheet(paperW, paperH, margin, headerH, footerH, palette, totalGridW, totalGridH, svgParts, pad) {
      const headerHtml = state.showHeader
        ? `<div style="height:${headerH}mm; color:${palette.text}; border-bottom: 0.35mm solid ${palette.main};" class="w-full flex items-end justify-between pb-1.5 mb-2 shrink-0">
            <div class="font-black text-[13pt] tracking-tight truncate pr-3">${escapeHtml(state.sheetTitle)}</div>
            <div class="text-[10.5pt] font-bold whitespace-nowrap flex items-baseline">
              <span class="inline-block w-[8mm]"></span><span>年</span>
              <span class="inline-block w-[8mm]"></span><span>組</span>
              <span class="inline-block w-[8mm]"></span><span>番</span>
              <span class="ml-3">なまえ（</span><span class="inline-block w-[36mm]"></span><span>）</span>
            </div>
          </div>`
        : '';

      const footerHtml = state.showScale
        ? `<div style="height:${footerH}mm; color:${palette.text};" class="w-full flex items-end justify-between pt-1 shrink-0 text-[7.5pt] font-bold">
            <span>※印刷時は倍率「100%（実際のサイズ）」で実寸通りになります</span>
            <svg width="56mm" height="5.5mm" viewBox="0 0 56 5.5" xmlns="http://www.w3.org/2000/svg">
              <line x1="1" y1="4" x2="51" y2="4" stroke="${palette.bold}" stroke-width="0.3"/>
              <line x1="1" y1="1.5" x2="1" y2="4" stroke="${palette.bold}" stroke-width="0.3"/>
              <line x1="11" y1="2.5" x2="11" y2="4" stroke="${palette.bold}" stroke-width="0.25"/>
              <line x1="21" y1="2.5" x2="21" y2="4" stroke="${palette.bold}" stroke-width="0.25"/>
              <line x1="31" y1="2.5" x2="31" y2="4" stroke="${palette.bold}" stroke-width="0.25"/>
              <line x1="41" y1="2.5" x2="41" y2="4" stroke="${palette.bold}" stroke-width="0.25"/>
              <line x1="51" y1="1.5" x2="51" y2="4" stroke="${palette.bold}" stroke-width="0.3"/>
              <text x="1" y="3" font-size="2.2" fill="${palette.text}" font-family="sans-serif">0</text>
              <text x="45" y="3" font-size="2.2" fill="${palette.text}" font-family="sans-serif">5cm</text>
            </svg>
          </div>`
        : '';

      const sheet = document.getElementById('paperSheet');
      sheet.style.width = `${paperW}mm`;
      sheet.style.height = `${paperH}mm`;
      sheet.style.padding = `${margin}mm`;

      const svgW = +(totalGridW + pad * 2).toFixed(3);
      const svgH = +(totalGridH + pad * 2).toFixed(3);

      sheet.innerHTML = `
        ${headerHtml}
        <div class="flex-1 flex items-center justify-center">
          <svg width="${svgW}mm" height="${svgH}mm" viewBox="${-pad} ${-pad} ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">
            ${svgParts.join('')}
          </svg>
        </div>
        ${footerHtml}
      `;

      applyPreviewScale();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // ==========================================
    // 5. UIイベント・プリセット連動
    // ==========================================
    function syncUiButtons() {
      document.querySelectorAll('.paper-btn').forEach(btn => {
        if (btn.dataset.paper === state.paper) {
          btn.className = 'paper-btn py-2 rounded-xl bg-emerald-600 text-white font-mono-tech font-black text-xs shadow-2xs transition';
        } else {
          btn.className = 'paper-btn py-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 font-mono-tech font-black text-xs transition';
        }
      });

      const pBtn = document.getElementById('orientPortraitBtn');
      const lBtn = document.getElementById('orientLandscapeBtn');
      if (state.orientation === 'portrait') {
        pBtn.className = 'flex-1 py-1.5 rounded-lg bg-white text-slate-900 shadow-2xs transition';
        lBtn.className = 'flex-1 py-1.5 rounded-lg text-slate-500 hover:text-slate-900 transition';
      } else {
        lBtn.className = 'flex-1 py-1.5 rounded-lg bg-white text-slate-900 shadow-2xs transition';
        pBtn.className = 'flex-1 py-1.5 rounded-lg text-slate-500 hover:text-slate-900 transition';
      }

      const mmBtn = document.getElementById('modeMmBtn');
      const cntBtn = document.getElementById('modeCountBtn');
      if (state.sizeMode === 'mm') {
        mmBtn.className = 'py-1.5 rounded-lg bg-white text-slate-900 shadow-2xs transition';
        cntBtn.className = 'py-1.5 rounded-lg text-slate-500 hover:text-slate-900 transition';
        document.getElementById('mmControlPanel').classList.remove('hidden');
        document.getElementById('countControlPanel').classList.add('hidden');
      } else {
        cntBtn.className = 'py-1.5 rounded-lg bg-white text-slate-900 shadow-2xs transition';
        mmBtn.className = 'py-1.5 rounded-lg text-slate-500 hover:text-slate-900 transition';
        document.getElementById('countControlPanel').classList.remove('hidden');
        document.getElementById('mmControlPanel').classList.add('hidden');
      }

      document.querySelectorAll('.mm-chip').forEach(chip => {
        if (parseFloat(chip.dataset.mm) === state.cellMm) {
          chip.className = 'mm-chip px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 ring-2 ring-emerald-400 font-mono-tech font-black text-xs';
        } else {
          chip.className = 'mm-chip px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 font-mono-tech font-bold text-xs';
        }
      });

      document.querySelectorAll('.color-btn').forEach(btn => {
        const c = btn.dataset.color;
        if (c === state.color) {
          const activeStyles = {
            black: 'border-2 border-slate-800 bg-slate-800 text-white',
            blue: 'border-2 border-sky-600 bg-sky-600 text-white',
            green: 'border-2 border-emerald-600 bg-emerald-600 text-white'
          };
          btn.className = `color-btn py-2 rounded-xl ${activeStyles[c]} font-black text-xs transition flex items-center justify-center gap-1`;
        } else {
          const idleText = { black: 'text-slate-700', blue: 'text-sky-700', green: 'text-emerald-700' };
          btn.className = `color-btn py-2 rounded-xl border border-slate-200 bg-white ${idleText[c]} font-black text-xs transition flex items-center justify-center gap-1`;
        }
      });

      const boldCheck = document.getElementById('boldEvery5Check');
      const boldLabel = document.getElementById('boldEvery5Label');
      const isGrid = state.layoutType === 'grid';
      boldCheck.disabled = !isGrid;
      boldLabel.classList.toggle('opacity-40', !isGrid);
      boldLabel.classList.toggle('cursor-not-allowed', !isGrid);

      document.getElementById('cellSizeMmInput').value = state.cellMm;
      document.getElementById('colsCountInput').value = state.colsCount;
      document.getElementById('rowsCountInput').value = state.rowsCount;
      document.getElementById('layoutTypeSelect').value = state.layoutType;
      document.getElementById('crossLeaderCheck').checked = state.crossLeader;
      document.getElementById('boldEvery5Check').checked = state.boldEvery5;
      document.getElementById('lineIntensitySelect').value = state.intensity;
      document.getElementById('showHeaderCheck').checked = state.showHeader;
      document.getElementById('sheetTitleInput').value = state.sheetTitle;
      document.getElementById('showScaleCheck').checked = state.showScale;
      document.getElementById('marginSelect').value = String(state.marginMm);
    }

    function applyPreset(presetName) {
      if (presetName === 'grade1') {
        Object.assign(state, {
          paper: 'A4', orientation: 'portrait', sizeMode: 'mm', cellMm: 18,
          layoutType: 'grid', crossLeader: true, boldEvery5: false,
          color: 'green', intensity: 'normal', showHeader: true, sheetTitle: 'こくご れんしゅう', showScale: false
        });
      } else if (presetName === 'kanji2') {
        Object.assign(state, {
          paper: 'A4', orientation: 'portrait', sizeMode: 'mm', cellMm: 15,
          layoutType: 'kanji_v', crossLeader: true, boldEvery5: false,
          color: 'green', intensity: 'normal', showHeader: true, sheetTitle: 'かんじ れんしゅう', showScale: false
        });
      } else if (presetName === 'math5') {
        Object.assign(state, {
          paper: 'A4', orientation: 'portrait', sizeMode: 'mm', cellMm: 5,
          layoutType: 'grid', crossLeader: false, boldEvery5: true,
          color: 'blue', intensity: 'normal', showHeader: true, sheetTitle: 'さんすう ほうがん', showScale: true
        });
      } else if (presetName === 'craft10') {
        Object.assign(state, {
          paper: 'B4', orientation: 'landscape', sizeMode: 'mm', cellMm: 10,
          layoutType: 'grid', crossLeader: false, boldEvery5: true,
          color: 'black', intensity: 'normal', showHeader: true, sheetTitle: 'こうさく せっけいず（1マス 1cm）', showScale: true
        });
      } else if (presetName === 'sakubun') {
        Object.assign(state, {
          paper: 'B4', orientation: 'landscape', sizeMode: 'count', colsCount: 20, rowsCount: 20,
          layoutType: 'genkou', crossLeader: false, boldEvery5: false,
          color: 'green', intensity: 'normal', showHeader: true, sheetTitle: 'さくぶん ようし', showScale: false
        });
      }
      syncUiButtons();
      renderSheet();
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      document.querySelectorAll('.preset-chip').forEach(btn => {
        btn.onclick = () => applyPreset(btn.dataset.preset);
      });

      document.querySelectorAll('.paper-btn').forEach(btn => {
        btn.onclick = () => {
          state.paper = btn.dataset.paper;
          syncUiButtons();
          renderSheet();
        };
      });

      document.getElementById('orientPortraitBtn').onclick = () => {
        state.orientation = 'portrait';
        syncUiButtons();
        renderSheet();
      };
      document.getElementById('orientLandscapeBtn').onclick = () => {
        state.orientation = 'landscape';
        syncUiButtons();
        renderSheet();
      };
      document.getElementById('marginSelect').onchange = (e) => {
        state.marginMm = parseInt(e.target.value, 10);
        renderSheet();
      };

      document.getElementById('modeMmBtn').onclick = () => {
        state.sizeMode = 'mm';
        syncUiButtons();
        renderSheet();
      };
      document.getElementById('modeCountBtn').onclick = () => {
        state.sizeMode = 'count';
        syncUiButtons();
        renderSheet();
      };

      document.querySelectorAll('.mm-chip').forEach(chip => {
        chip.onclick = () => {
          state.cellMm = parseFloat(chip.dataset.mm);
          syncUiButtons();
          renderSheet();
        };
      });
      document.getElementById('cellSizeMmInput').oninput = (e) => {
        const val = parseFloat(e.target.value);
        if (!isNaN(val) && val >= 3 && val <= 50) {
          state.cellMm = val;
          syncUiButtons();
          renderSheet();
        }
      };

      document.getElementById('colsCountInput').oninput = (e) => {
        const val = parseInt(e.target.value, 10);
        if (!isNaN(val) && val >= 1 && val <= 80) {
          state.colsCount = val;
          renderSheet();
        }
      };
      document.getElementById('rowsCountInput').oninput = (e) => {
        const val = parseInt(e.target.value, 10);
        if (!isNaN(val) && val >= 1 && val <= 100) {
          state.rowsCount = val;
          renderSheet();
        }
      };

      document.getElementById('layoutTypeSelect').onchange = (e) => {
        state.layoutType = e.target.value;
        syncUiButtons();
        renderSheet();
      };
      document.getElementById('crossLeaderCheck').onchange = (e) => {
        state.crossLeader = e.target.checked;
        renderSheet();
      };
      document.getElementById('boldEvery5Check').onchange = (e) => {
        state.boldEvery5 = e.target.checked;
        renderSheet();
      };

      document.querySelectorAll('.color-btn').forEach(btn => {
        btn.onclick = () => {
          state.color = btn.dataset.color;
          syncUiButtons();
          renderSheet();
        };
      });
      document.getElementById('lineIntensitySelect').onchange = (e) => {
        state.intensity = e.target.value;
        renderSheet();
      };

      document.getElementById('showHeaderCheck').onchange = (e) => {
        state.showHeader = e.target.checked;
        renderSheet();
      };
      document.getElementById('sheetTitleInput').oninput = (e) => {
        state.sheetTitle = e.target.value;
        renderSheet();
      };
      document.getElementById('showScaleCheck').onchange = (e) => {
        state.showScale = e.target.checked;
        renderSheet();
      };

      const zoomFitBtn = document.getElementById('zoomFitBtn');
      const zoom100Btn = document.getElementById('zoom100Btn');
      zoomFitBtn.onclick = () => {
        state.zoomMode = 'fit';
        zoomFitBtn.className = 'px-2.5 py-0.5 rounded-lg bg-white text-slate-900 shadow-2xs transition';
        zoom100Btn.className = 'px-2.5 py-0.5 rounded-lg text-slate-500 hover:text-slate-900 transition';
        applyPreviewScale();
      };
      zoom100Btn.onclick = () => {
        state.zoomMode = '100';
        zoom100Btn.className = 'px-2.5 py-0.5 rounded-lg bg-white text-slate-900 shadow-2xs transition';
        zoomFitBtn.className = 'px-2.5 py-0.5 rounded-lg text-slate-500 hover:text-slate-900 transition';
        applyPreviewScale();
      };

      document.getElementById('headerPrintBtn').onclick = () => window.print();

      window.addEventListener('resize', applyPreviewScale);

      syncUiButtons();
      renderSheet();
    });
  </script>
</body>
</html>
