<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一括ルビ振りメーカー | センセイボックス</title>
  <meta name="description" content="Wordファイル（.docx）や文章を貼り付けるだけで一気にふりがなを自動付与。学年別の未習漢字フィルタや、ルビ付きWordファイル直接出力・縦書きA4横向き印刷に対応した先生向け無料Webツール。">
  <link rel="canonical" href="https://sensei-otasuke.github.io/teacher-tools/ruby/" />
  <link rel="icon" href="../logo.png" type="image/png">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@700;900&family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Mammoth.js (.docx 読込) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  <!-- JSZip (.docx 直接生成出力) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style id="dynamicPrintStyle">
    @page {
      size: A4 portrait;
      margin: 15mm;
    }
  </style>

  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
    .font-mono-tech { font-family: 'Chivo Mono', monospace; }
    .font-mincho { font-family: 'Noto Serif JP', serif; }

    /* ルビのスタイルとサイズ変数 */
    :root {
      --ruby-scale: 0.48em;
    }
    ruby {
      ruby-align: center;
    }
    rt {
      font-size: var(--ruby-scale);
      font-weight: 700;
      color: #4f46e5;
      user-select: none;
    }

    /* クリック編集可能なルビ単語 */
    .ruby-word {
      cursor: pointer;
      border-radius: 4px;
      padding: 0 1px;
      transition: background-color 0.15s;
    }
    .ruby-word:hover {
      background-color: #eef2ff;
      outline: 1px dashed #6366f1;
    }

    /* 縦書き・横書きプレビュー用 */
    .vertical-text {
      writing-mode: vertical-rl;
      text-orientation: upright;
      line-height: 2.35;
      letter-spacing: 0.04em;
    }
    .horizontal-text {
      writing-mode: horizontal-tb;
      line-height: 2.25;
    }

    /* 印刷用スタイル（横書き改ページ＆縦書きA4横向き完全対応） */
    @media print {
      html, body {
        background: white !important;
        color: black !important;
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
        overflow: visible !important;
      }
      header, #dictStatusBanner, #leftColumn, #previewToolbar, #previewActions, #toast, #editRubyModal {
        display: none !important;
      }
      main, #rightColumn, #previewCard {
        display: block !important;
        width: 100% !important;
        max-width: none !important;
        min-height: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        border: none !important;
        box-shadow: none !important;
        background: white !important;
        overflow: visible !important;
      }
      #printArea {
        display: block !important;
        width: 100% !important;
        max-height: none !important;
        overflow: visible !important;
        border: none !important;
        background: white !important;
        color: black !important;
        padding: 0 !important;
        margin: 0 !important;
        font-size: 13pt !important;
      }
      #printArea.vertical-text {
        height: 172mm !important;
      }
      #printArea.horizontal-text {
        height: auto !important;
      }
      rt {
        color: #1e293b !important;
      }
      .ruby-word:hover {
        background-color: transparent !important;
        outline: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ヘッダー -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="../" class="p-2 text-slate-400 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition" title="ポータルへ戻る">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-violet-100 border border-violet-200 flex items-center justify-center text-xl">
            🔤
          </div>
          <div>
            <h1 class="text-base sm:text-lg font-black text-slate-900 tracking-tight flex items-center gap-2">
              <span>一括ルビ振りメーカー</span>
              <span class="hidden sm:inline text-[10px] font-mono-tech font-bold bg-violet-50 text-violet-700 border border-violet-200 px-2 py-0.5 rounded-full">Word出力対応</span>
            </h1>
            <p class="text-[10px] text-slate-400 font-bold hidden sm:block">Wordファイルや文章に一瞬でふりがなを一括付与</p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1 text-[11px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200/60 px-2.5 py-1 rounded-full">
          <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">サーバー送信ゼロ（ブラウザ内処理）</span>
          <span class="sm:hidden">完全ローカル</span>
        </span>
      </div>
    </div>
  </header>

  <!-- 辞書ロード状態バー -->
  <div id="dictStatusBanner" class="bg-indigo-600 text-white text-xs font-bold py-2 px-4 text-center flex items-center justify-center gap-2">
    <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
    <span id="dictStatusText">裏方で日本語ふりがな辞書を準備中です（画面操作はそのまま可能です）...</span>
  </div>

  <!-- メインエリア -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左カラム：入力 ＆ オプション設定 (5カラム) -->
    <div id="leftColumn" class="lg:col-span-5 flex flex-col gap-4">
      
      <!-- 1. Wordアップロード ＆ テキスト入力カード -->
      <div class="bg-white rounded-3xl border border-slate-200/90 p-5 shadow-xs flex flex-col gap-4">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-black text-slate-800 flex items-center gap-1.5">
            <span class="w-5 h-5 rounded-full bg-violet-600 text-white text-xs flex items-center justify-center font-mono-tech">1</span>
            <span>文章を入力 または Word読込</span>
          </h2>
          <button id="sampleTextBtn" class="text-[11px] font-bold text-violet-600 hover:text-violet-800 bg-violet-50 px-2.5 py-1 rounded-lg transition">
            例文を入れる
          </button>
        </div>

        <!-- Word (.docx) ドラッグ＆ドロップ枠 -->
        <label id="dropZone" class="border-2 border-dashed border-slate-300 hover:border-violet-500 hover:bg-violet-50/40 rounded-2xl p-4 text-center cursor-pointer transition flex flex-col items-center justify-center gap-1.5 group">
          <input id="docxInput" type="file" accept=".docx" class="hidden">
          <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center group-hover:scale-110 transition-transform">
            <i data-lucide="file-text" class="w-5 h-5"></i>
          </div>
          <p class="text-xs font-black text-slate-700">Wordファイル（.docx）を選択 または ドロップ</p>
          <p id="fileNameLabel" class="text-[11px] text-slate-400 font-medium">※ファイル内のテキストを自動で抽出します</p>
        </label>

        <!-- テキストエリア -->
        <div class="relative">
          <textarea id="sourceText" rows="7" placeholder="ここにルビを振りたい文章を貼り付けてください。&#10;（Wordからコピーした文章もそのまま貼り付けできます）" class="w-full p-3.5 text-sm bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:border-violet-500 focus:outline-none leading-relaxed resize-y"></textarea>
          <button id="clearTextBtn" class="absolute bottom-3 right-3 text-[11px] font-bold text-slate-400 hover:text-rose-500 bg-white/90 border border-slate-200 px-2 py-1 rounded-lg shadow-2xs transition">
            クリア
          </button>
        </div>
      </div>

      <!-- 2. ルビ振りルール設定 -->
      <div class="bg-white rounded-3xl border border-slate-200/90 p-5 shadow-xs flex flex-col gap-4">
        <h2 class="text-sm font-black text-slate-800 flex items-center gap-1.5">
          <span class="w-5 h-5 rounded-full bg-violet-600 text-white text-xs flex items-center justify-center font-mono-tech">2</span>
          <span>ルビを振る対象の設定</span>
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-500 mb-1">対象学年フィルタ</label>
            <select id="gradeFilter" class="w-full p-2.5 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl focus:border-violet-500 focus:outline-none">
              <option value="0" selected>すべての漢字にルビを振る（総ルビ）</option>
              <option value="1">小1で未習の漢字のみ（小2以上）</option>
              <option value="2">小2で未習の漢字のみ（小3以上）</option>
              <option value="3">小3で未習の漢字のみ（小4以上）</option>
              <option value="4">小4で未習の漢字のみ（小5以上）</option>
              <option value="5">小5で未習の漢字のみ（小6以上）</option>
              <option value="6">小6で未習の漢字のみ（中学生以上）</option>
            </select>
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-500 mb-1">カタカナ語へのルビ</label>
            <select id="katakanaOption" class="w-full p-2.5 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl focus:border-violet-500 focus:outline-none">
              <option value="none" selected>カタカナには振らない（標準）</option>
              <option value="hiragana">カタカナにもひらがなルビを振る</option>
            </select>
          </div>
        </div>

        <!-- 実行ボタン -->
        <button id="convertBtn" disabled class="w-full py-3.5 bg-violet-600 hover:bg-violet-700 disabled:bg-slate-300 disabled:cursor-not-allowed active:scale-98 text-white font-black text-sm sm:text-base rounded-2xl shadow-md transition flex items-center justify-center gap-2">
          <i data-lucide="sparkles" class="w-5 h-5" id="convertBtnIcon"></i>
          <span id="convertBtnText">辞書準備中...</span>
        </button>
      </div>

    </div>

    <!-- 右カラム：プレビュー ＆ Word出力・印刷 (7カラム) -->
    <div id="rightColumn" class="lg:col-span-7 flex flex-col gap-4">
      <div id="previewCard" class="bg-white rounded-3xl border border-slate-200/90 p-5 shadow-xs flex-1 flex flex-col justify-between min-h-[540px]">
        
        <!-- 上部ツールバー -->
        <div id="previewToolbar" class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
          <div class="flex items-center gap-2">
            <h2 class="text-sm font-black text-slate-800">プレビュー</h2>
            <span class="text-[11px] text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md font-bold">単語クリックで一括修正</span>
          </div>

          <!-- ルビサイズ・書字方向・フォント切り替え -->
          <div class="flex flex-wrap items-center gap-1.5">
            <!-- ルビサイズ調整 -->
            <div class="inline-flex items-center rounded-xl bg-slate-100 p-1 text-[11px] font-bold" title="ルビ文字の大きさ">
              <span class="px-1.5 text-slate-400">ルビ</span>
              <button data-rsize="small" class="rsize-btn px-2 py-0.5 rounded-lg text-slate-500 hover:text-slate-900 transition">小</button>
              <button data-rsize="normal" class="rsize-btn px-2 py-0.5 rounded-lg bg-white text-slate-900 shadow-2xs transition">標準</button>
              <button data-rsize="large" class="rsize-btn px-2 py-0.5 rounded-lg text-slate-500 hover:text-slate-900 transition">大</button>
            </div>

            <!-- 横書き・縦書き -->
            <div class="inline-flex rounded-xl bg-slate-100 p-1 text-[11px] font-bold">
              <button id="dirHorizontalBtn" class="px-2.5 py-0.5 rounded-lg bg-white text-slate-900 shadow-2xs transition">横書き</button>
              <button id="dirVerticalBtn" class="px-2.5 py-0.5 rounded-lg text-slate-500 hover:text-slate-900 transition">縦書き</button>
            </div>

            <!-- 明朝体・ゴシック体 -->
            <button id="fontToggleBtn" class="px-2.5 py-1 rounded-xl border border-slate-200 text-[11px] font-bold text-slate-600 hover:bg-slate-50 transition" title="書体切り替え">
              明朝体
            </button>
          </div>
        </div>

        <!-- ルビ表示・印刷エリア -->
        <div id="printArea" class="my-4 flex-1 p-5 sm:p-6 bg-slate-50/70 border border-slate-200/80 rounded-2xl overflow-auto max-h-[460px] horizontal-text text-lg sm:text-xl text-slate-900">
          <div id="emptyPlaceholder" class="h-full flex flex-col items-center justify-center text-center text-slate-400 py-16">
            <span class="text-4xl mb-2">📝</span>
            <p class="text-sm font-bold text-slate-500">左側に文章を入力して「一気にルビを振る！」を押してください</p>
            <p class="text-xs mt-1">変換後、文字バランスが崩れない正規Wordファイル（.docx）として直接保存できます</p>
          </div>
          <div id="rubyOutput" class="hidden whitespace-pre-wrap break-words"></div>
        </div>

        <!-- 下部アクションボタン群（Word直接保存・コピー・印刷） -->
        <div id="previewActions" class="pt-3 border-t border-slate-100 flex flex-col gap-2">
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
            <!-- 正規Word (.docx) 直接ダウンロード -->
            <button id="downloadDocxBtn" class="flex-1 py-3 px-4 bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-black text-xs sm:text-sm rounded-xl shadow-sm transition flex items-center justify-center gap-2">
              <i data-lucide="download" class="w-4 h-4"></i>
              <span>Wordファイル（.docx）で保存</span>
            </button>

            <!-- そのまま印刷（横書き改ページ・縦書きA4横向き自動対応） -->
            <button id="printBtn" class="py-3 px-5 bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-black text-xs sm:text-sm rounded-xl shadow-sm transition flex items-center justify-center gap-1.5">
              <i data-lucide="printer" class="w-4 h-4"></i>
              <span id="printBtnLabel">印刷（A4縦）</span>
            </button>
          </div>

          <div class="flex items-center gap-2">
            <!-- Word用リッチHTMLコピー -->
            <button id="copyWordBtn" class="flex-1 py-2 px-3 bg-slate-100 hover:bg-slate-200 active:scale-98 text-slate-700 font-bold text-[11px] rounded-xl transition flex items-center justify-center gap-1.5">
              <i data-lucide="clipboard-check" class="w-3.5 h-3.5 text-blue-600"></i>
              <span>Word貼付用にコピー</span>
            </button>

            <!-- カッコ書きテキストコピー -->
            <button id="copyParenBtn" class="flex-1 py-2 px-3 bg-slate-100 hover:bg-slate-200 active:scale-98 text-slate-700 font-bold text-[11px] rounded-xl transition flex items-center justify-center gap-1.5">
              <i data-lucide="copy" class="w-3.5 h-3.5 text-slate-500"></i>
              <span>カッコ書きコピー：漢字（かんじ）</span>
            </button>
          </div>
        </div>

      </div>
    </div>

  </main>

  <!-- ========================================== -->
  <!-- 単語のルビ修正モーダル（単体修正 ＆ 一括置換対応） -->
  <!-- ========================================== -->
  <div id="editRubyModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-200 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="font-black text-base text-slate-900 flex items-center gap-2">
          <i data-lucide="edit-3" class="w-4 h-4 text-violet-600"></i>
          <span>ふりがなの修正</span>
        </h3>
        <button id="closeEditModalBtn" class="p-1 text-slate-400 hover:text-slate-600 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-3">
        <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200/80 text-center">
          <span class="text-[11px] font-bold text-slate-400 block mb-0.5">対象の単語</span>
          <span id="editTargetWord" class="text-2xl font-black text-slate-900">豆太</span>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">新しいふりがな（空欄にするとルビ削除）</label>
          <input id="editRubyInput" type="text" placeholder="例：まめた" class="w-full p-3 text-base font-bold bg-white border-2 border-violet-300 rounded-xl focus:border-violet-600 focus:outline-none">
        </div>
      </div>

      <div class="flex flex-col gap-2 pt-2">
        <button id="applyAllSameBtn" class="w-full py-3 bg-violet-600 hover:bg-violet-700 active:scale-98 text-white font-black text-xs sm:text-sm rounded-xl shadow-sm transition flex items-center justify-center gap-1.5">
          <i data-lucide="replace-all" class="w-4 h-4"></i>
          <span id="applyAllSameLabel">文章内の同じ単語をすべて一括変更</span>
        </button>
        <button id="applySingleBtn" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 active:scale-98 text-slate-700 font-bold text-xs rounded-xl transition">
          この1箇所だけ変更する
        </button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-bold px-5 py-3 rounded-2xl shadow-xl opacity-0 pointer-events-none transition-opacity duration-200 z-50 flex items-center gap-2">
    <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastText">完了しました！</span>
  </div>

  <script>
    // ==========================================
    // 1. 学年別配当漢字データ（小学校1〜6年・1026字）
    // ==========================================
    const GRADE_KANJI = {
      1: "一右雨円王音下火花貝学気九休玉金空月犬見五口校左三山子四糸字耳七車手十出女小上森人水正生青夕石赤千川先早草足村大男竹中虫町天田土二日入年白八百文木本名目立力林六",
      2: "引羽雲園遠何科夏家歌画回会海絵外角楽活間丸岩顔汽記帰弓牛魚京強教近兄形計元言原戸古午後語工公広交光考行高黄合谷国黒今才細作算止市矢姉思紙寺自時室社弱首秋週春書少場色食心新親図数西声星晴切雪船線前組走多太体台地池知茶昼長鳥朝直通弟店点電刀冬当東答頭同道読内南肉馬売買麦半番父風分聞米歩母方北毎妹万明鳴毛門夜野友用曜来里理話",
      3: "悪安暗医委意育員院飲運泳駅央横屋温化荷界開階寒感漢館岸起期客究急級宮球去橋業曲局銀区苦具君係軽血決研県庫湖向幸港号根祭皿仕死使始指歯詩次事持式実写者主守取酒受州拾終習集住重暑助昭消商章勝乗植申身神真深進世整昔全相送想息速族他打対待代第題炭短談着注柱丁帳調追定庭笛鉄転都度投豆島湯登等動童農波配倍箱畑発反坂板皮悲美鼻筆氷表秒病品負部服福物平返勉放味命面問役薬由油有遊予羊洋葉陽様落流旅両緑礼列練路和",

      6: "胃異遺域宇映延沿我灰拡革閣割株干巻看簡危机揮貴疑吸供胸郷勤筋系敬警劇激穴絹権憲源厳己呼誤后孝皇紅降鋼刻穀骨困砂座済裁策冊蚕至私姿視詞誌磁射捨尺若樹収宗就衆従縦縮熟純処署諸除将傷障城蒸針仁垂推寸盛聖誠宣専泉洗染善奏窓創装層操蔵臓存尊宅担探誕段暖値宙忠著庁頂潮賃痛展討党糖届難乳認納脳派拝背肺俳班晩否批秘腹奮並陛閉片補暮宝訪亡忘棒枚幕密盟模訳郵優幼欲翌乱卵覧裏律臨朗論"
    };

    function getLearnedKanjiSet(maxGrade) {
      const set = new Set();
      for (let g = 1; g <= maxGrade; g++) {
        for (const ch of GRADE_KANJI[g]) {
          set.add(ch);
        }
      }
      return set;
    }

    // ==========================================
    // 2. インライン Web Worker（裏方スレッド）の構築
    // ==========================================
    const workerCode = `
      importScripts("https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js");

      let tokenizer = null;

      kuromoji.builder({ dicPath: "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/" }).build(function(err, builtTokenizer) {
        if (err) {
          self.postMessage({ type: "error", message: err.message || "辞書の読み込みに失敗しました" });
          return;
        }
        tokenizer = builtTokenizer;
        self.postMessage({ type: "ready" });
      });

      self.onmessage = function(e) {
        const msg = e.data;
        if (msg.type === "tokenize") {
          if (!tokenizer) {
            self.postMessage({ type: "error", message: "辞書がまだ準備中です" });
            return;
          }
          const lines = msg.text.split("\\n");
          const tokenizedLines = lines.map(function(line) {
            return tokenizer.tokenize(line).map(function(t) {
              return {
                surface_form: t.surface_form,
                reading: t.reading || ""
              };
            });
          });
          self.postMessage({
            type: "tokenized",
            tokenizedLines: tokenizedLines,
            requestId: msg.requestId
          });
        }
      };
    `;

    const workerBlob = new Blob([workerCode], { type: "application/javascript" });
    const workerUrl = URL.createObjectURL(workerBlob);
    const rubyWorker = new Worker(workerUrl);

    let isWorkerReady = false;
    let pendingAutoConvert = false;
    let latestRequestId = 0;

    const dictBanner = document.getElementById('dictStatusBanner');
    const dictText = document.getElementById('dictStatusText');
    const convertBtn = document.getElementById('convertBtn');
    const convertBtnText = document.getElementById('convertBtnText');

    rubyWorker.onmessage = function(e) {
      const data = e.data;

      if (data.type === "ready") {
        isWorkerReady = true;
        dictBanner.className = "bg-emerald-600 text-white text-xs font-bold py-1.5 px-4 text-center transition-all";
        dictText.textContent = "✅ 準備完了！いつでもルビ変換できます";
        convertBtn.disabled = false;
        convertBtnText.textContent = "一気にルビを振る！";

        setTimeout(() => {
          dictBanner.classList.add('hidden');
        }, 2500);

        if (pendingAutoConvert) {
          pendingAutoConvert = false;
          requestTokenize();
        }
      }
      else if (data.type === "tokenized") {
        if (data.requestId !== latestRequestId) return;
        buildRubySegments(data.tokenizedLines);
        convertBtn.disabled = false;
        convertBtnText.textContent = "一気にルビを振る！";
        showToast('ルビを一括変換しました！');
      }
      else if (data.type === "error") {
        dictBanner.className = "bg-rose-600 text-white text-xs font-bold py-2 px-4 text-center";
        dictBanner.classList.remove('hidden');
        dictText.textContent = data.message + "（ページを再読み込みしてください）";
        convertBtn.disabled = false;
        convertBtnText.textContent = "一気にルビを振る！";
      }
    };

    // ==========================================
    // 3. 文字判定 ＆ ルビ割り当てロジック
    // ==========================================
    const kanjiRegex = /[\u4E00-\u9FFF\u3400-\u4DBF々ヶ]/;
    const katakanaRegex = /^[\u30A1-\u30F6ー]+$/;

    function katakanaToHiragana(str) {
      return str.replace(/[\u30A1-\u30F6]/g, match => {
        return String.fromCharCode(match.charCodeAt(0) - 0x60);
      });
    }

    function splitKanjiAndOkurigana(surface, readingHira) {
      if (!surface || !readingHira) return [{ text: surface, ruby: null }];

      let surfEnd = surface.length;
      let readEnd = readingHira.length;
      while (surfEnd > 0 && readEnd > 0 && surface[surfEnd - 1] === readingHira[readEnd - 1] && !kanjiRegex.test(surface[surfEnd - 1])) {
        surfEnd--;
        readEnd--;
      }

      let surfStart = 0;
      let readStart = 0;
      while (surfStart < surfEnd && readStart < readEnd && surface[surfStart] === readingHira[readStart] && !kanjiRegex.test(surface[surfStart])) {
        surfStart++;
        readStart++;
      }

      const result = [];
      if (surfStart > 0) {
        result.push({ text: surface.slice(0, surfStart), ruby: null });
      }
      const coreText = surface.slice(surfStart, surfEnd);
      const coreRuby = readingHira.slice(readStart, readEnd);
      if (coreText) {
        result.push({ text: coreText, ruby: coreRuby || null });
      }
      if (surfEnd < surface.length) {
        result.push({ text: surface.slice(surfEnd), ruby: null });
      }
      return result;
    }

    let renderedSegments = [];
    let currentRubySize = 'normal'; // 'small' | 'normal' | 'large'
    let isVertical = false;
    let isMincho = false;

    function requestTokenize() {
      const rawText = document.getElementById('sourceText').value;
      if (!rawText.trim()) {
        showToast('文章を入力してください');
        return;
      }

      if (!isWorkerReady) {
        pendingAutoConvert = true;
        showToast('辞書の準備が終わるまで数秒お待ちください...');
        return;
      }

      latestRequestId++;
      convertBtn.disabled = true;
      convertBtnText.textContent = "変換中...";

      rubyWorker.postMessage({
        type: "tokenize",
        text: rawText,
        requestId: latestRequestId
      });
    }

    function buildRubySegments(tokenizedLines) {
      const maxGrade = parseInt(document.getElementById('gradeFilter').value, 10);
      const learnedSet = maxGrade > 0 ? getLearnedKanjiSet(maxGrade) : null;
      const katakanaMode = document.getElementById('katakanaOption').value;

      renderedSegments = [];

      tokenizedLines.forEach((tokens, lineIdx) => {
        tokens.forEach(token => {
          const surface = token.surface_form;
          const reading = token.reading;

          if (kanjiRegex.test(surface) && reading) {
            const hira = katakanaToHiragana(reading);
            let shouldAddRuby = true;
            if (learnedSet) {
              const kanjiChars = [...surface].filter(c => kanjiRegex.test(c) && c !== '々' && c !== 'ヶ');
              shouldAddRuby = kanjiChars.some(c => !learnedSet.has(c));
            }

            if (shouldAddRuby && surface !== hira) {
              const parts = splitKanjiAndOkurigana(surface, hira);
              parts.forEach(p => renderedSegments.push(p));
            } else {
              renderedSegments.push({ text: surface, ruby: null });
            }
          }
          else if (katakanaMode === 'hiragana' && katakanaRegex.test(surface) && surface.length > 1) {
            renderedSegments.push({ text: surface, ruby: katakanaToHiragana(surface) });
          }
          else {
            renderedSegments.push({ text: surface, ruby: null });
          }
        });

        if (lineIdx < tokenizedLines.length - 1) {
          renderedSegments.push({ text: '\n', ruby: null });
        }
      });

      renderPreview();
    }

    function renderPreview() {
      const outputEl = document.getElementById('rubyOutput');
      const placeholder = document.getElementById('emptyPlaceholder');

      placeholder.classList.add('hidden');
      outputEl.classList.remove('hidden');
      outputEl.innerHTML = '';

      renderedSegments.forEach((seg, idx) => {
        if (seg.text === '\n') {
          outputEl.appendChild(document.createElement('br'));
          return;
        }

        if (seg.ruby) {
          const rubyEl = document.createElement('ruby');
          rubyEl.className = 'ruby-word';
          rubyEl.title = 'クリックして読み方を修正・一括置換';
          rubyEl.textContent = seg.text;

          const rtEl = document.createElement('rt');
          rtEl.textContent = seg.ruby;
          rubyEl.appendChild(rtEl);

          rubyEl.onclick = () => openEditModal(idx);
          outputEl.appendChild(rubyEl);
        } else {
          if (kanjiRegex.test(seg.text)) {
            const span = document.createElement('span');
            span.className = 'ruby-word';
            span.title = 'クリックしてふりがなを追加・一括設定';
            span.textContent = seg.text;
            span.onclick = () => openEditModal(idx);
            outputEl.appendChild(span);
          } else {
            outputEl.appendChild(document.createTextNode(seg.text));
          }
        }
      });
    }

    // ==========================================
    // 4. 単語ルビ修正モーダル（単体 ＆ 一括置換）
    // ==========================================
    let editingSegmentIndex = -1;
    const editModal = document.getElementById('editRubyModal');
    const editTargetWord = document.getElementById('editTargetWord');
    const editRubyInput = document.getElementById('editRubyInput');
    const applyAllSameLabel = document.getElementById('applyAllSameLabel');

    function openEditModal(idx) {
      editingSegmentIndex = idx;
      const seg = renderedSegments[idx];
      if (!seg) return;

      const sameCount = renderedSegments.filter(s => s.text === seg.text).length;
      editTargetWord.textContent = seg.text;
      editRubyInput.value = seg.ruby || '';
      applyAllSameLabel.textContent = sameCount > 1
        ? `文章内の「${seg.text}」（全${sameCount}箇所）を一括変更`
        : `この単語のふりがなを確定`;

      editModal.classList.remove('hidden');
      editRubyInput.focus();
      editRubyInput.select();
    }

    function closeEditModal() {
      editModal.classList.add('hidden');
      editingSegmentIndex = -1;
    }

    document.getElementById('closeEditModalBtn').onclick = closeEditModal;
    editModal.onclick = (e) => {
      if (e.target === editModal) closeEditModal();
    };

    document.getElementById('applySingleBtn').onclick = () => {
      if (editingSegmentIndex < 0) return;
      const newVal = editRubyInput.value.trim() || null;
      renderedSegments[editingSegmentIndex].ruby = newVal;
      renderPreview();
      closeEditModal();
      showToast('1箇所のふりがなを更新しました');
    };

    document.getElementById('applyAllSameBtn').onclick = () => {
      if (editingSegmentIndex < 0) return;
      const targetText = renderedSegments[editingSegmentIndex].text;
      const newVal = editRubyInput.value.trim() || null;
      let count = 0;

      renderedSegments.forEach(seg => {
        if (seg.text === targetText) {
          seg.ruby = newVal;
          count++;
        }
      });

      renderPreview();
      closeEditModal();
      showToast(`「${targetText}」（${count}箇所）を一括更新しました！`);
    };

    editRubyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('applyAllSameBtn').click();
      }
    });

    // ==========================================
    // 5. Word (.docx) ファイル読み込み処理
    // ==========================================
    const docxInput = document.getElementById('docxInput');
    const dropZone = document.getElementById('dropZone');
    const fileNameLabel = document.getElementById('fileNameLabel');

    function handleDocxFile(file) {
      if (!file) return;
      if (!file.name.endsWith('.docx')) {
        alert('.docx 形式のWordファイルを選択してください。');
        return;
      }

      fileNameLabel.textContent = `📄 読み込み中: ${file.name}`;
      const reader = new FileReader();
      reader.onload = function(event) {
        const arrayBuffer = event.target.result;
        mammoth.extractRawText({ arrayBuffer: arrayBuffer })
          .then(result => {
            // 連続する余分な空行を整えつつ段落を保持
            const cleaned = result.value.replace(/\n{3,}/g, '\n\n').trim();
            document.getElementById('sourceText').value = cleaned;
            fileNameLabel.textContent = `✅ 読込完了: ${file.name}`;
            requestTokenize();
          })
          .catch(err => {
            console.error(err);
            alert('Wordファイルの読み込みに失敗しました。');
            fileNameLabel.textContent = '※ファイル内のテキストを自動で抽出します';
          });
      };
      reader.readAsArrayBuffer(file);
    }

    docxInput.onchange = (e) => handleDocxFile(e.target.files[0]);

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-violet-500', 'bg-violet-50');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-violet-500', 'bg-violet-50');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-violet-500', 'bg-violet-50');
      if (e.dataTransfer.files.length > 0) {
        handleDocxFile(e.dataTransfer.files[0]);
      }
    });

    // ==========================================
    // 6. 正規 Wordファイル（.docx）直接ダウンロード生成
    //    ※ OOXML <w:ruby> 形式で出力するため文字バランスが一切崩れない
    // ==========================================
    function escapeXml(str) {
      return str.replace(/[<>&'"]/g, c => ({
        '<': '&lt;', '>': '&gt;', '&': '&amp;', '\'': '&apos;', '"': '&quot;'
      }[c]));
    }

    document.getElementById('downloadDocxBtn').onclick = async () => {
      if (renderedSegments.length === 0) {
        showToast('先にルビ変換を行ってください');
        return;
      }

      const zip = new JSZip();

      // フォント・ルビサイズ設定（half-points単位: 22 = 11pt, 10 = 5pt）
      const fontName = isMincho ? 'Yu Mincho' : 'Yu Gothic';
      const baseHps = 22; // 11pt
      const rubyHpsMap = { small: 8, normal: 10, large: 12 }; // 4pt / 5pt / 6pt
      const rubyHps = rubyHpsMap[currentRubySize] || 10;
      const hpsRaise = 20; // 10pt上げ

      // 段落ごとに分割
      const paragraphs = [[]];
      renderedSegments.forEach(seg => {
        if (seg.text === '\n') {
          paragraphs.push([]);
        } else {
          paragraphs[paragraphs.length - 1].push(seg);
        }
      });

      const rPrXml = `<w:rPr><w:rFonts w:ascii="${fontName}" w:eastAsia="${fontName}" w:hAnsi="${fontName}"/><w:sz w:val="${baseHps}"/><w:szCs w:val="${baseHps}"/></w:rPr>`;
      const rtRPrXml = `<w:rPr><w:rFonts w:ascii="${fontName}" w:eastAsia="${fontName}" w:hAnsi="${fontName}"/><w:sz w:val="${rubyHps}"/><w:szCs w:val="${rubyHps}"/></w:rPr>`;

      let bodyParagraphsXml = '';
      paragraphs.forEach(pSegs => {
        if (pSegs.length === 0) {
          bodyParagraphsXml += '<w:p/>';
          return;
        }
        let runsXml = '';
        pSegs.forEach(seg => {
          if (seg.ruby) {
            runsXml += `
              <w:r>
                ${rPrXml}
                <w:ruby>
                  <w:rubyPr>
                    <w:rubyAlign w:val="distributeSpace"/>
                    <w:hps w:val="${rubyHps}"/>
                    <w:hpsRaise w:val="${hpsRaise}"/>
                    <w:hpsBaseText w:val="${baseHps}"/>
                    <w:lid w:val="ja-JP"/>
                  </w:rubyPr>
                  <w:rt>
                    <w:r>
                      ${rtRPrXml}
                      <w:t>${escapeXml(seg.ruby)}</w:t>
                    </w:r>
                  </w:rt>
                  <w:rubyBase>
                    <w:r>
                      ${rPrXml}
                      <w:t xml:space="preserve">${escapeXml(seg.text)}</w:t>
                    </w:r>
                  </w:rubyBase>
                </w:ruby>
              </w:r>`;
          } else {
            runsXml += `
              <w:r>
                ${rPrXml}
                <w:t xml:space="preserve">${escapeXml(seg.text)}</w:t>
              </w:r>`;
          }
        });
        bodyParagraphsXml += `<w:p>${runsXml}</w:p>`;
      });

      // 用紙設定（縦書き時はA4横向き＋縦書き方向、横書き時はA4縦向き）
      const sectPrXml = isVertical
        ? `<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/><w:textDirection w:val="tbRl"/></w:sectPr>`
        : `<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr>`;

      const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${bodyParagraphsXml}
    ${sectPrXml}
  </w:body>
</w:document>`;

      const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;

      const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

      zip.file('[Content_Types].xml', contentTypesXml);
      zip.folder('_rels').file('.rels', relsXml);
      zip.folder('word').file('document.xml', documentXml);

      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ルビ付きプリント_${new Date().toISOString().slice(0, 10)}.docx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast('Wordファイル（.docx）をダウンロードしました！');
    };

    // ==========================================
    // 7. Word貼付用リッチHTMLコピー ＆ カッコ書きコピー
    // ==========================================
    document.getElementById('copyWordBtn').onclick = async () => {
      if (renderedSegments.length === 0) {
        showToast('先にルビ変換を行ってください');
        return;
      }

      const rtPtMap = { small: '4.5pt', normal: '5.5pt', large: '6.5pt' };
      const rtPt = rtPtMap[currentRubySize] || '5.5pt';
      const fontFamily = isMincho ? "'Yu Mincho', 'MS Mincho', serif" : "'Yu Gothic', 'Meiryo', sans-serif";

      let htmlParts = [`<div style="font-family: ${fontFamily}; font-size: 11pt; line-height: 1.9;">`];
      let plainParts = [];

      renderedSegments.forEach(seg => {
        if (seg.text === '\n') {
          htmlParts.push('<br>');
          plainParts.push('\n');
        } else if (seg.ruby) {
          htmlParts.push(`<ruby style="ruby-align:center;">${seg.text}<rt style="font-size:${rtPt};">${seg.ruby}</rt></ruby>`);
          plainParts.push(`${seg.text}(${seg.ruby})`);
        } else {
          htmlParts.push(seg.text);
          plainParts.push(seg.text);
        }
      });
      htmlParts.push('</div>');

      const htmlString = htmlParts.join('');
      const plainString = plainParts.join('');

      try {
        const htmlBlob = new Blob([htmlString], { type: 'text/html' });
        const textBlob = new Blob([plainString], { type: 'text/plain' });
        const clipboardItem = new ClipboardItem({
          'text/html': htmlBlob,
          'text/plain': textBlob
        });
        await navigator.clipboard.write([clipboardItem]);
        showToast('Word用にコピーしました！そのまま貼り付け（Ctrl+V / ⌘+V）できます');
      } catch (err) {
        navigator.clipboard.writeText(plainString);
        showToast('テキストをコピーしました');
      }
    };

    document.getElementById('copyParenBtn').onclick = () => {
      if (renderedSegments.length === 0) {
        showToast('先にルビ変換を行ってください');
        return;
      }
      const text = renderedSegments.map(seg => seg.ruby ? `${seg.text}（${seg.ruby}）` : seg.text).join('');
      navigator.clipboard.writeText(text);
      showToast('カッコ書き形式でコピーしました！');
    };

    // ==========================================
    // 8. UI操作（ルビサイズ・縦書き/横書き・フォント・印刷）
    // ==========================================
    const printArea = document.getElementById('printArea');
    const dirHorizontalBtn = document.getElementById('dirHorizontalBtn');
    const dirVerticalBtn = document.getElementById('dirVerticalBtn');
    const fontToggleBtn = document.getElementById('fontToggleBtn');
    const printBtnLabel = document.getElementById('printBtnLabel');
    const dynamicPrintStyle = document.getElementById('dynamicPrintStyle');

    // ルビサイズ切り替え
    document.querySelectorAll('.rsize-btn').forEach(btn => {
      btn.onclick = () => {
        currentRubySize = btn.dataset.rsize;
        const scaleMap = { small: '0.38em', normal: '0.48em', large: '0.60em' };
        document.documentElement.style.setProperty('--ruby-scale', scaleMap[currentRubySize]);

        document.querySelectorAll('.rsize-btn').forEach(b => {
          b.className = 'rsize-btn px-2 py-0.5 rounded-lg text-slate-500 hover:text-slate-900 transition';
        });
        btn.className = 'rsize-btn px-2 py-0.5 rounded-lg bg-white text-slate-900 shadow-2xs transition';
      };
    });

    // 横書き（印刷はA4縦向き）
    dirHorizontalBtn.onclick = () => {
      isVertical = false;
      printArea.classList.remove('vertical-text');
      printArea.classList.add('horizontal-text');
      dirHorizontalBtn.className = 'px-2.5 py-0.5 rounded-lg bg-white text-slate-900 shadow-2xs transition';
      dirVerticalBtn.className = 'px-2.5 py-0.5 rounded-lg text-slate-500 hover:text-slate-900 transition';
      printBtnLabel.textContent = '印刷（A4縦）';
      dynamicPrintStyle.textContent = '@page { size: A4 portrait; margin: 15mm; }';
    };

    // 縦書き（印刷はA4横向き）
    dirVerticalBtn.onclick = () => {
      isVertical = true;
      printArea.classList.remove('horizontal-text');
      printArea.classList.add('vertical-text');
      dirVerticalBtn.className = 'px-2.5 py-0.5 rounded-lg bg-white text-slate-900 shadow-2xs transition';
      dirHorizontalBtn.className = 'px-2.5 py-0.5 rounded-lg text-slate-500 hover:text-slate-900 transition';
      printBtnLabel.textContent = '印刷（A4横）';
      dynamicPrintStyle.textContent = '@page { size: A4 landscape; margin: 15mm; }';
    };

    fontToggleBtn.onclick = () => {
      isMincho = !isMincho;
      if (isMincho) {
        printArea.classList.add('font-mincho');
        fontToggleBtn.textContent = 'ゴシック体';
      } else {
        printArea.classList.remove('font-mincho');
        fontToggleBtn.textContent = '明朝体';
      }
    };

    document.getElementById('printBtn').onclick = () => {
      if (renderedSegments.length === 0) {
        showToast('先にルビ変換を行ってください');
        return;
      }
      window.print();
    };

    convertBtn.onclick = requestTokenize;

    document.getElementById('sampleTextBtn').onclick = () => {
      document.getElementById('sourceText').value =
        "明日の遠足では、地域の歴史博物館を見学します。\n集合時刻は午前八時三十分ですので、遅れないように登校してください。\n雨天の場合は体育館でオリエンテーションを実施します。";
      requestTokenize();
    };

    document.getElementById('clearTextBtn').onclick = () => {
      document.getElementById('sourceText').value = '';
      fileNameLabel.textContent = '※ファイル内のテキストを自動で抽出します';
      renderedSegments = [];
      document.getElementById('rubyOutput').classList.add('hidden');
      document.getElementById('emptyPlaceholder').classList.remove('hidden');
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 3200);
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
