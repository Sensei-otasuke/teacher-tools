<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教員向けWeb便利ツール集</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200 py-6 px-4">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-2xl font-bold text-slate-900">📚 授業・学級経営 Webツール集</h1>
      <p class="text-sm text-slate-500 mt-1">現役教員が作成しているインストール不要・ブラウザ上で安全に動作する教員向けツール集です。</p>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      
      <!-- 席替えツールカード -->
      <a href="./sekigae/" target="_blank" rel="noopener noreferrer" class="block bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-400 transition group">
        <div class="text-3xl mb-3">🪑</div>
        <div class="flex items-center justify-between mb-1">
          <h2 class="text-lg font-bold text-slate-900 group-hover:text-indigo-600 transition">席替えルーレット</h2>
          <svg class="w-4 h-4 text-slate-400 group-hover:text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
          </svg>
        </div>
        <p class="text-sm text-slate-600 mb-4">先生用事前決定・児童向けスロット演出・固定席・Excel出力に対応した席替えツール。</p>
        <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">別タブで開く ↗</span>
      </a>

      <!-- 授業用大型タイマーカード -->
      <a href="./timer/" target="_blank" rel="noopener noreferrer" class="block bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md hover:border-emerald-400 transition group">
        <div class="text-3xl mb-3">⏱️</div>
        <div class="flex items-center justify-between mb-1">
          <h2 class="text-lg font-bold text-slate-900 group-hover:text-emerald-600 transition">授業用大型タイマー</h2>
          <svg class="w-4 h-4 text-slate-400 group-hover:text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
          </svg>
        </div>
        <p class="text-sm text-slate-600 mb-4">極大表示・円形プログレス・優しいチャイム音・全画面投影に対応した授業用タイマー。</p>
        <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-1 rounded">別タブで開く ↗</span>
      </a>

    </div>
  </main>
</body>
</html>
