<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教員向け便利ツール集</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200 py-6 px-4">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-2xl font-bold text-slate-900">📚 授業・学級経営 Webツール集</h1>
      <p class="text-sm text-slate-500 mt-1">インストール不要・ブラウザ上で安全に動作する教育向けツール集です。</p>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      
      <!-- 席替えツールカード -->
      <a href="./sekigae/" class="block bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-400 transition">
        <div class="text-3xl mb-3">🪑</div>
        <h2 class="text-lg font-bold text-slate-900 mb-1">席替えルーレット</h2>
        <p class="text-sm text-slate-600 mb-4">演出付きシャッフル・固定席設定・座席表印刷に対応した席替え支援ツール。</p>
        <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">開く →</span>
      </a>

      <!-- 今後のツール枠 -->
      <div class="bg-slate-100 p-6 rounded-xl border border-dashed border-slate-300 opacity-75">
        <div class="text-3xl mb-3">⏱️</div>
        <h2 class="text-lg font-bold text-slate-700 mb-1">授業用大型タイマー</h2>
        <p class="text-sm text-slate-500 mb-4">特大カウンター</p>
        <span class="text-xs text-slate-400">Coming Soon</span>
      </div>

    </div>
  </main>
</body>
</html>
